<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Agent Lab · 游戏知识库问答 Agent 与效果评测平台</title>
<style>
  /* ============================================================
     Game Agent Lab · 视觉系统
     深空藏青 + 星轨青 + 鎏金，取《崩坏：星穹铁道》官方物料的气质，
     但保持「评测工具」该有的克制：动效服务于信息层级，不做装饰性噪音。
     ============================================================ */
  :root{
    --paper:#EDF1F8; --paper-2:#E6ECF6; --surface:#FFFFFF; --surface-2:#F7F9FD;
    --line:rgba(15,35,68,.10); --line-2:rgba(15,35,68,.055); --line-3:rgba(15,35,68,.16);

    --ink:#0A1830; --ink-2:#2E3E5C; --muted:#6C7B96; --muted-2:#93A1B8;

    --navy:#0C1E3C; --navy-2:#153060; --navy-3:#1D3E78;
    --accent:#3A76E0; --accent-2:#5AB0E8; --accent-soft:#E9F1FE;
    --cyan:#38B2CE;
    --gold:#C08A2E; --gold-2:#E0AC4C; --gold-soft:#FBF3E1;

    --ok:#148A5E; --ok-soft:#E4F6EE;
    --bad:#C9483C; --bad-soft:#FDECEA;
    --warn:#B4761A; --warn-soft:#FCF1DF;

    --r:14px; --r-s:9px; --r-xs:6px;
    --sh-1:0 1px 2px rgba(12,30,60,.05);
    --sh-2:0 1px 2px rgba(12,30,60,.05), 0 10px 26px -14px rgba(12,30,60,.30);
    --sh-3:0 2px 4px rgba(12,30,60,.06), 0 22px 46px -20px rgba(12,30,60,.40);
    --sh-glow:0 0 0 1px rgba(58,118,224,.30), 0 8px 30px -12px rgba(58,118,224,.45);

    --ez:cubic-bezier(.22,.85,.28,1);
    --ez-out:cubic-bezier(.16,1,.3,1);

    --mono:"Cascadia Mono","JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --disp:"Bahnschrift","DIN Alternate","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    --sans:"HarmonyOS Sans SC","MiSans","PingFang SC","Hiragino Sans GB","Source Han Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    font-size:14px; line-height:1.65; -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* 纸面：极淡的网格 + 顶部冷光，避免整页死灰 */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(900px 460px at 50% -12%, rgba(58,118,224,.10), transparent 66%),
      linear-gradient(rgba(15,35,68,.030) 1px, transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg, rgba(15,35,68,.030) 1px, transparent 1px) 0 0/34px 100%;
    mask-image:linear-gradient(#000, #000 60%, transparent);
  }
  a{color:var(--accent);text-decoration:none}
  h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:.1px}
  code,pre,.mono{font-family:var(--mono)}
  ::selection{background:rgba(58,118,224,.24)}

  /* 滚动进度 */
  #sprog{
    position:fixed;top:0;left:0;height:2px;width:0;z-index:99;
    background:linear-gradient(90deg,var(--accent),var(--cyan),var(--gold-2));
    box-shadow:0 0 12px rgba(58,118,224,.55);transition:width .12s linear;
  }

  /* ============================ HERO ============================ */
  .hero{
    position:relative;color:#EAF1FB;padding:46px 32px 40px;overflow:hidden;
    background:
      radial-gradient(1200px 520px at 14% -18%, rgba(58,118,224,.42), transparent 62%),
      radial-gradient(820px 380px at 88% -6%, rgba(56,178,206,.26), transparent 64%),
      radial-gradient(700px 420px at 70% 120%, rgba(192,138,46,.20), transparent 66%),
      linear-gradient(158deg,#071228 0%,#0C1E3C 46%,#143261 100%);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  /* 官方主视觉（《崩坏：星穹铁道》4.6 官网 KV）只取右侧作气氛层：
     左侧必须干净，否则正文压在插画上会糊成一团。 */
  .hero-art{
    position:absolute;top:0;right:0;bottom:0;width:66%;z-index:0;
    background-image:url("assets/hero_kv.jpg");
    background-size:cover;background-position:52% 46%;background-repeat:no-repeat;
    opacity:.58;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.55) 30%,#000 62%,#000 100%);
    mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.55) 30%,#000 62%,#000 100%);
  }
  /* 压一层藏青，把插画拉回「工具」该有的克制，同时保证标题对比度 */
  .hero-art::after{
    content:"";position:absolute;inset:0;
    background:
      linear-gradient(90deg,rgba(7,18,40,.88) 0%,rgba(7,18,40,.50) 34%,rgba(10,24,52,.20) 100%),
      linear-gradient(180deg,rgba(7,18,40,.26) 0%,rgba(7,18,40,.12) 40%,rgba(7,18,40,.56) 100%);
  }
  #heroStars{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:.85;z-index:1}
  .hero-aurora{
    position:absolute;inset:-30% -10% auto -10%;height:120%;pointer-events:none;z-index:2;
    background:
      radial-gradient(46% 34% at 26% 34%, rgba(90,176,232,.30), transparent 70%),
      radial-gradient(38% 30% at 74% 24%, rgba(192,138,46,.20), transparent 72%);
    filter:blur(28px);animation:aurora 18s var(--ez) infinite alternate;
  }
  @keyframes aurora{
    0%{transform:translate3d(0,0,0) scale(1)}
    100%{transform:translate3d(-2.5%,2%,0) scale(1.07)}
  }
  .hero-in{position:relative;z-index:2;max-width:1240px;margin:0 auto}
  .brand-tag{
    display:inline-flex;align-items:center;gap:9px;
    font-family:var(--mono);font-size:11px;letter-spacing:2.6px;text-transform:uppercase;
    color:#A9C8F2;border:1px solid rgba(169,200,242,.32);border-radius:999px;
    padding:5px 14px;margin-bottom:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
    backdrop-filter:blur(6px);
    animation:riseIn .7s var(--ez-out) both;
  }
  .brand-tag i{
    width:6px;height:6px;border-radius:50%;background:#6FC6F0;display:block;
    box-shadow:0 0 12px #6FC6F0;animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.78)}}

  .hero h1{
    font-size:clamp(26px,3.4vw,38px);line-height:1.2;letter-spacing:.6px;
    animation:riseIn .8s .06s var(--ez-out) both;
  }
  .hero h1 .grad{
    background:linear-gradient(100deg,#7FC4F2 0%,#E6C577 52%,#F0D79B 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    background-size:220% 100%;animation:sheen 9s linear infinite;
  }
  @keyframes sheen{0%{background-position:0 0}100%{background-position:220% 0}}
  .hero .sub{
    color:#B7C8E2;margin-top:12px;font-size:14.5px;max-width:860px;line-height:1.78;
    animation:riseIn .8s .12s var(--ez-out) both;
  }
  .hero .sub strong{color:#F0C96A;font-weight:700}
  .hero-meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
  .chip{
    position:relative;border-radius:999px;padding:5px 13px;font-size:12.5px;color:#CBD9EE;
    background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.13);
    animation:riseIn .6s var(--ez-out) both;
    transition:transform .25s var(--ez), border-color .25s, background .25s;
  }
  .chip:hover{transform:translateY(-2px);border-color:rgba(127,196,242,.55);
    background:linear-gradient(180deg,rgba(127,196,242,.20),rgba(127,196,242,.06))}
  .chip b{color:#F0C96A;font-weight:700}
  .hero-note{
    margin-top:22px;padding:13px 16px;border-left:3px solid #5FA8E8;
    background:linear-gradient(90deg,rgba(95,168,232,.16),rgba(95,168,232,.04));
    border-radius:0 var(--r-s) var(--r-s) 0;font-size:12.9px;color:#BDD1EC;
    animation:riseIn .8s .24s var(--ez-out) both;
  }
  .hero-note b{color:#fff}
  .hero-rule{
    position:absolute;left:0;right:0;bottom:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(127,196,242,.75),rgba(240,201,106,.65),transparent);
    opacity:.7;
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ============================ TABS ============================ */
  .tabs{
    position:sticky;top:0;z-index:30;
    background:rgba(237,241,248,.82);backdrop-filter:blur(14px) saturate(1.4);
    border-bottom:1px solid var(--line);
  }
  .tabs-in{position:relative;max-width:1240px;margin:0 auto;display:flex;gap:2px;padding:0 32px;overflow-x:auto;scrollbar-width:none}
  .tabs-in::-webkit-scrollbar{display:none}
  .tab-pill{
    position:absolute;left:0;bottom:0;height:2.5px;border-radius:3px;
    background:linear-gradient(90deg,var(--accent),var(--cyan));
    box-shadow:0 0 14px rgba(58,118,224,.55);
    transition:transform .42s var(--ez-out), width .42s var(--ez-out);
    pointer-events:none;
  }
  .tab{
    position:relative;border:0;background:none;font-family:var(--sans);font-size:13.5px;font-weight:600;
    color:var(--muted);padding:15px 15px 13px;cursor:pointer;white-space:nowrap;
    transition:color .22s var(--ez), transform .22s var(--ez);
  }
  .tab:hover{color:var(--ink-2);transform:translateY(-1px)}
  .tab.on{color:var(--navy)}
  .tab .n{font-family:var(--mono);font-size:11px;color:var(--muted-2);margin-right:7px;transition:color .22s}
  .tab.on .n{color:var(--accent)}

  /* ============================ LAYOUT ============================ */
  main{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:28px 32px 76px}
  .view{display:none}
  .view.on{display:block}

  /* 卡片：错峰进场 */
  .view.on .card{animation:cardIn .62s var(--ez-out) both}
  .view.on .card:nth-child(1){animation-delay:.02s}
  .view.on .card:nth-child(2){animation-delay:.09s}
  .view.on .card:nth-child(3){animation-delay:.16s}
  .view.on .card:nth-child(4){animation-delay:.23s}
  .view.on .card:nth-child(5){animation-delay:.30s}
  .view.on .card:nth-child(n+6){animation-delay:.36s}
  @keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.994)}to{opacity:1;transform:none}}

  .card{
    position:relative;background:linear-gradient(180deg,var(--surface) 0%,#FBFCFE 100%);
    border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-2);
    padding:22px 24px;margin-bottom:18px;
    transition:transform .32s var(--ez), box-shadow .32s var(--ez), border-color .32s var(--ez);
  }
  /* 顶部强调线：hover 时从左展开 */
  .card::before{
    content:"";position:absolute;left:18px;right:18px;top:-1px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--accent),var(--cyan),transparent);
    transform:scaleX(0);transform-origin:left;opacity:0;
    transition:transform .5s var(--ez-out), opacity .3s;
  }
  .card:hover{transform:translateY(-2px);box-shadow:var(--sh-3);border-color:var(--line-3)}
  .card:hover::before{transform:scaleX(1);opacity:.9}
  .card.tight{padding:16px 18px}

  .card-h{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:15px;flex-wrap:wrap}
  .card-h h3{font-size:16px;letter-spacing:.2px}
  .card-h .hint{font-size:12.5px;color:var(--muted)}
  .eyebrow{
    font-family:var(--mono);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:7px;
  }
  .eyebrow::before{content:"";display:inline-block;width:14px;height:1.5px;background:var(--accent);
    vertical-align:middle;margin-right:8px;opacity:.75;border-radius:2px}
  /* 卡片进场时引导线从 0 生长，给标题一个「起笔」的感觉 */
  .view.on .card .eyebrow::before{animation:ruleIn .68s .14s var(--ez-out) both}
  @keyframes ruleIn{from{width:0;opacity:0}to{width:14px;opacity:.75}}
  .grid{display:grid;gap:15px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:1000px){.g4,.g3{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:680px){.g2,.g3,.g4{grid-template-columns:1fr}main{padding:18px 16px 60px}
    .tabs-in{padding:0 16px}.hero{padding:30px 18px 28px}}

  /* ============================ KPI ============================ */
  .kpi{
    position:relative;background:linear-gradient(180deg,#fff,#F8FAFE);
    border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;overflow:hidden;
    transition:transform .3s var(--ez), box-shadow .3s var(--ez);
  }
  .kpi::after{
    content:"";position:absolute;right:-28px;top:-28px;width:78px;height:78px;border-radius:50%;
    background:radial-gradient(circle,rgba(58,118,224,.14),transparent 70%);
    transition:transform .45s var(--ez);
  }
  .kpi:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
  .kpi:hover::after{transform:scale(1.5)}
  .kpi .lab{font-size:12px;color:var(--muted);font-weight:600}
  .kpi .val{
    font-family:var(--disp);font-size:29px;font-weight:700;line-height:1.14;margin-top:5px;
    letter-spacing:-.4px;font-variant-numeric:tabular-nums;
  }
  .kpi .val small{font-size:13px;font-weight:600;color:var(--muted-2);margin-left:3px}
  .kpi .desc{font-size:11.5px;color:var(--muted-2);margin-top:6px}
  .kpi.good .val{color:var(--ok)} .kpi.bad .val{color:var(--bad)} .kpi.warn .val{color:var(--warn)}
  .kpi.accent .val{color:var(--accent)}

  /* ============================ BADGE ============================ */
  .badge{
    display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:2.5px 8px;line-height:1.5;
    border:1px solid transparent;white-space:nowrap;
    transition:transform .2s var(--ez), box-shadow .2s var(--ez);
  }
  .badge:hover{transform:translateY(-1px)}
  .b-ok{background:var(--ok-soft);color:var(--ok);border-color:#B9E4D0}
  .b-bad{background:var(--bad-soft);color:var(--bad);border-color:#F2CBC6}
  .b-warn{background:var(--warn-soft);color:var(--warn);border-color:#EFDAB4}
  .b-info{background:var(--accent-soft);color:var(--accent);border-color:#C8DAF8}
  .b-gold{background:var(--gold-soft);color:var(--gold);border-color:#EBD7A9}
  .b-mut{background:#F1F4FA;color:var(--muted);border-color:var(--line)}

  /* ============================ TABLE ============================ */
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
  /* sticky 的 top 必须相对滚动容器 .tbl-wrap 计算，写成导航栏高度会让表头浮起来盖住首行 */
  th{
    font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700;
    background:linear-gradient(180deg,#FAFCFF,#F4F7FC);position:sticky;top:0;z-index:2;
    box-shadow:inset 0 -1px 0 var(--line-3);
  }
  tbody tr{transition:background .18s var(--ez)}
  tbody tr:hover{background:linear-gradient(90deg,rgba(58,118,224,.075),rgba(58,118,224,.015))}
  .tbl-wrap{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-s);background:#fff}
  .tbl-wrap::-webkit-scrollbar{width:11px;height:11px}
  .tbl-wrap::-webkit-scrollbar-thumb{background:#C6D2E4;border-radius:8px;border:3px solid #fff}
  .tbl-wrap::-webkit-scrollbar-thumb:hover{background:#A9BBD6}
  .tbl-wrap::-webkit-scrollbar-track{background:transparent}

  /* ============================ BUTTON ============================ */
  button.btn{
    position:relative;font-family:var(--sans);font-size:13.5px;font-weight:600;border-radius:var(--r-s);
    padding:10px 17px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink-2);
    transition:transform .16s var(--ez), box-shadow .24s var(--ez), border-color .24s, background .24s;
    overflow:hidden;
  }
  button.btn:hover{border-color:#BCCDE8;background:#FBFDFF;transform:translateY(-1px);box-shadow:var(--sh-1)}
  button.btn:active{transform:translateY(0) scale(.985)}
  button.btn.primary{
    background:linear-gradient(158deg,var(--navy-2),var(--navy));border-color:var(--navy);color:#fff;
    box-shadow:0 6px 20px -10px rgba(21,48,96,.85);
  }
  button.btn.primary:hover{
    background:linear-gradient(158deg,var(--navy-3),var(--navy-2));border-color:var(--navy-2);
    box-shadow:0 10px 26px -10px rgba(29,62,120,.9);
  }
  button.btn.gold{background:#fff;border-color:#E5D0A0;color:var(--gold)}
  button.btn.gold:hover{background:var(--gold-soft)}
  button.btn:disabled{opacity:.5;cursor:default;transform:none}
  button.btn.sm{font-size:12.5px;padding:7px 12px}

  /* 分段控件：滑动药丸 */
  .seg{position:relative;display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;
    background:linear-gradient(180deg,#F7F9FD,#EFF3FA);gap:2px}
  .seg .seg-pill{
    position:absolute;top:3px;bottom:3px;left:0;border-radius:999px;z-index:0;
    background:linear-gradient(158deg,var(--navy-2),var(--navy));
    box-shadow:0 4px 14px -6px rgba(21,48,96,.8);
    transition:transform .4s var(--ez-out), width .4s var(--ez-out), background .3s;
  }
  .seg .seg-pill.v1{background:linear-gradient(158deg,#6E7C96,#55637C)}
  .seg button{
    position:relative;z-index:1;border:0;background:none;font-family:var(--sans);font-size:12.5px;font-weight:600;
    color:var(--muted);padding:6px 15px;border-radius:999px;cursor:pointer;transition:color .25s var(--ez)
  }
  .seg button.on{color:#fff}

  /* ============================ FORM ============================ */
  input.field,textarea.field{
    width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);
    border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;background:#fff;
    outline:none;transition:border-color .2s, box-shadow .25s;resize:vertical
  }
  input.field:focus,textarea.field:focus{border-color:#A7C4F0;box-shadow:0 0 0 4px rgba(58,118,224,.12)}
  input.field::placeholder{color:#A9B5C9}
  select.field{font-family:var(--sans);font-size:13px;border:1px solid var(--line);border-radius:var(--r-s);
    padding:9px 11px;background:#fff;color:var(--ink);cursor:pointer}

  .qrow{display:flex;gap:10px;align-items:stretch}
  .qrow input{flex:1}
  .sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .sugg button{
    font-size:12.3px;color:var(--ink-2);background:#fff;border:1px dashed var(--line-3);
    border-radius:999px;padding:6px 13px;cursor:pointer;font-family:var(--sans);
    transition:all .22s var(--ez);
  }
  .sugg button:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);transform:translateY(-2px)}
  .sugg button:active{transform:translateY(0) scale(.98)}

  /* ============================ ANSWER ============================ */
  .answer{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;position:relative}
  .answer::before{
    content:"";position:absolute;top:0;left:0;right:0;height:2px;z-index:2;
    background:linear-gradient(90deg,transparent,var(--accent-2),var(--cyan),transparent);
    background-size:220% 100%;animation:scan 3.4s linear infinite;
  }
  @keyframes scan{0%{background-position:-120% 0}100%{background-position:220% 0}}
  .answer-h{
    background:linear-gradient(120deg,#0C1E3C,#17376C);color:#E9F1FC;padding:11px 16px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px
  }
  .answer-h .st{font-family:var(--mono);font-size:11.5px;color:#9FC0EA}
  .answer-b{
    padding:17px 19px;white-space:pre-wrap;font-size:13.7px;line-height:1.82;color:var(--ink-2);
    animation:fadeUp .5s var(--ez-out) both
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .answer-b .cite{color:var(--accent);font-weight:700}
  .refuse{border-left:3px solid var(--warn);background:linear-gradient(90deg,var(--warn-soft),#fff 42%)}

  /* ============================ EVIDENCE ============================ */
  .evi{
    position:relative;border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;margin-bottom:10px;
    background:linear-gradient(180deg,#fff,#FBFCFE);
    transition:transform .26s var(--ez), box-shadow .26s var(--ez), border-color .26s;
    animation:fadeUp .5s var(--ez-out) both;
  }
  .evi:hover{transform:translateX(3px);box-shadow:var(--sh-2);border-color:var(--line-3)}
  .evi .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .evi .t{font-weight:700;font-size:13.2px}
  .evi .score{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .bar{height:5px;border-radius:3px;background:#EDF1F8;margin-top:9px;overflow:hidden}
  .bar i{
    display:block;height:100%;border-radius:3px;width:0;
    background:linear-gradient(90deg,var(--accent-2),var(--accent));
    transition:width 1.05s var(--ez-out);
  }
  .evi .snip{font-size:12.3px;color:var(--muted);margin-top:8px;line-height:1.62}
  .evi .meta{font-size:11.2px;color:var(--muted-2);margin-top:8px;font-family:var(--mono)}

  /* ============================ PROMPT ============================ */
  pre.prompt{
    background:linear-gradient(180deg,#0B1830,#0E1F3D);color:#C3D8F3;border-radius:var(--r-s);
    padding:16px 18px;font-size:12.2px;line-height:1.75;overflow:auto;max-height:340px;
    white-space:pre-wrap;border:1px solid #1E3760;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  }
  pre.prompt::selection{background:rgba(90,176,232,.35)}

  /* ============================ FLOW ============================ */
  .flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:900px){.flow{grid-template-columns:1fr 1fr}}
  .step{
    position:relative;background:linear-gradient(180deg,#fff,#F9FBFE);border:1px solid var(--line);
    border-radius:var(--r-s);padding:15px 16px;overflow:hidden;
    transition:transform .3s var(--ez), box-shadow .3s var(--ez), border-color .3s;
  }
  .step::after{
    content:"";position:absolute;inset:auto -30% -60% auto;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle,rgba(58,118,224,.13),transparent 70%);
    transition:transform .5s var(--ez);
  }
  .step:hover{transform:translateY(-4px);box-shadow:var(--sh-2);border-color:var(--line-3)}
  .step:hover::after{transform:scale(1.6)}
  .step .idx{
    font-family:var(--mono);font-size:11px;color:#fff;border-radius:6px;padding:2px 8px;display:inline-block;
    margin-bottom:9px;background:linear-gradient(150deg,var(--navy-2),var(--navy));
    box-shadow:0 4px 12px -6px rgba(21,48,96,.9)
  }
  .step h4{font-size:13.8px;margin-bottom:6px;position:relative}
  .step p{margin:0;font-size:12.3px;color:var(--muted);line-height:1.62;position:relative}
  /* 让「闭环」这件事被看见：编号 01→04 依次点亮，像一圈信号在跑 */
  .step .idx{animation:stepLive 4s var(--ez) infinite}
  .step:nth-child(2) .idx{animation-delay:1s}
  .step:nth-child(3) .idx{animation-delay:2s}
  .step:nth-child(4) .idx{animation-delay:3s}
  /* 0% 必须是「未点亮」态，否则循环回卷时会硬切 */
  @keyframes stepLive{
    0%  {background:linear-gradient(150deg,var(--navy-2),var(--navy));
         box-shadow:0 0 0 0 rgba(58,118,224,0);transform:none}
    4%  {background:linear-gradient(150deg,var(--accent-2),var(--accent));
         box-shadow:0 0 0 0 rgba(58,118,224,.50);transform:translateY(-2px)}
    11% {box-shadow:0 0 0 8px rgba(58,118,224,0)}
    23% {background:linear-gradient(150deg,var(--accent-2),var(--accent));
         box-shadow:0 0 0 0 rgba(58,118,224,0);transform:translateY(-2px)}
    31%,100%{background:linear-gradient(150deg,var(--navy-2),var(--navy));
         box-shadow:0 0 0 0 rgba(58,118,224,0);transform:none}
  }

  /* ============================ NOTE ============================ */
  .note{
    border-left:3px solid var(--accent);background:linear-gradient(90deg,var(--accent-soft),rgba(233,241,254,.32));
    border-radius:0 var(--r-s) var(--r-s) 0;padding:12px 15px;font-size:12.9px;color:var(--ink-2);line-height:1.72
  }
  .note.warn{border-left-color:var(--warn);background:linear-gradient(90deg,var(--warn-soft),rgba(252,241,223,.32))}
  .note.gold{border-left-color:var(--gold);background:linear-gradient(90deg,var(--gold-soft),rgba(251,243,225,.32))}
  .note b{color:var(--ink)}
  ul.plain{margin:9px 0 0;padding-left:20px;font-size:13.2px;color:var(--ink-2)}
  ul.plain li{margin-bottom:6px}
  ul.plain li::marker{color:var(--accent)}
  ul.plain li b{color:var(--ink)}

  /* ============================ COMPARE ============================ */
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:15px}
  @media(max-width:820px){.cmp{grid-template-columns:1fr}}
  .cmp-col{border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:#fff;
    transition:transform .28s var(--ez), box-shadow .28s var(--ez)}
  .cmp-col:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
  .cmp-col .hd{padding:10px 14px;font-size:12.8px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .cmp-col.v1 .hd{background:linear-gradient(180deg,#F4F6FB,#EDF1F7);color:#5B6B85;border-bottom:1px solid var(--line)}
  .cmp-col.v2 .hd{background:linear-gradient(180deg,#E9F1FE,#DCE9FC);color:#1D4E9C;border-bottom:1px solid #D2E1F8}
  .cmp-col .bd{padding:12px 14px;font-size:12.4px;line-height:1.7;white-space:pre-wrap;color:var(--ink-2);
    max-height:260px;overflow:auto}

  .legend{display:flex;flex-wrap:wrap;gap:15px;font-size:12px;color:var(--muted);margin-top:9px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:3px;display:inline-block}

  .kv{display:grid;grid-template-columns:120px 1fr;gap:7px 12px;font-size:12.6px}
  .kv dt{color:var(--muted)} .kv dd{margin:0;color:var(--ink-2)}

  footer{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 32px 56px;color:var(--muted-2);font-size:12px}

  .spin{display:inline-block;width:13px;height:13px;border:2px solid #CBD8EA;border-top-color:var(--accent);
    border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .mtable td.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.3px}
  .delta.up{color:var(--ok);font-weight:700} .delta.down{color:var(--bad);font-weight:700}

  /* 表格里的小进度条：让「覆盖率」这类比例在扫读时直接可感 */
  .mbar{height:5px;border-radius:3px;background:#EDF1F8;overflow:hidden;min-width:52px}
  .mbar i{display:block;height:100%;border-radius:3px;width:0;
    background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width 1s var(--ez-out)}
  .mbar.g i{background:linear-gradient(90deg,#6FCBA4,var(--ok))}
  .mbar.w i{background:linear-gradient(90deg,#E8C178,var(--warn))}
  .mbar.b i{background:linear-gradient(90deg,#E79A92,var(--bad))}
  .cov{display:flex;flex-direction:column;gap:5px;min-width:56px}
  .cov .n{font-family:var(--mono);font-size:11.7px;color:var(--ink-2);font-variant-numeric:tabular-nums}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important}
    .card::before{transform:scaleX(1);opacity:.9}
  }
</style>
</head>
