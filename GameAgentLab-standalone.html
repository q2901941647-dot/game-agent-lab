<title>Game Agent Lab · 游戏知识库问答 Agent 与效果评测平台</title>
<style>
  /* ============================================================
     Game Agent Lab · 视觉系统
     深空藏青 + 星轨青 + 鎏金，取《崩坏：星穹铁道》官方物料的气质，
     但保持「评测工具」该有的克制：动效服务于信息层级，不做装饰性噪音。
     ============================================================ */
  :root{
    --paper:#EDF1F8; --paper-2:#E6ECF6; --surface:#FFFFFF; --surface-2:#F7F9FD;
    --line:rgba(15,35,68,.10); --line-2:rgba(15,35,68,.055); --line-3:rgba(15,35,68,.16);

    --ink:#0A1830; --ink-2:#2E3E5C; --muted:#6C7B96; --muted-2:#93A1B8;

    --navy:#0C1E3C; --navy-2:#153060; --navy-3:#1D3E78;
    --accent:#3A76E0; --accent-2:#5AB0E8; --accent-soft:#E9F1FE;
    --cyan:#38B2CE;
    --gold:#C08A2E; --gold-2:#E0AC4C; --gold-soft:#FBF3E1;

    --ok:#148A5E; --ok-soft:#E4F6EE;
    --bad:#C9483C; --bad-soft:#FDECEA;
    --warn:#B4761A; --warn-soft:#FCF1DF;

    --r:14px; --r-s:9px; --r-xs:6px;
    --sh-1:0 1px 2px rgba(12,30,60,.05);
    --sh-2:0 1px 2px rgba(12,30,60,.05), 0 10px 26px -14px rgba(12,30,60,.30);
    --sh-3:0 2px 4px rgba(12,30,60,.06), 0 22px 46px -20px rgba(12,30,60,.40);
    --sh-glow:0 0 0 1px rgba(58,118,224,.30), 0 8px 30px -12px rgba(58,118,224,.45);

    --ez:cubic-bezier(.22,.85,.28,1);
    --ez-out:cubic-bezier(.16,1,.3,1);

    --mono:"Cascadia Mono","JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --disp:"Bahnschrift","DIN Alternate","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    --sans:"HarmonyOS Sans SC","MiSans","PingFang SC","Hiragino Sans GB","Source Han Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    font-size:14px; line-height:1.65; -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* 纸面：极淡的网格 + 顶部冷光，避免整页死灰 */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(900px 460px at 50% -12%, rgba(58,118,224,.10), transparent 66%),
      linear-gradient(rgba(15,35,68,.030) 1px, transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg, rgba(15,35,68,.030) 1px, transparent 1px) 0 0/34px 100%;
    mask-image:linear-gradient(#000, #000 60%, transparent);
  }
  a{color:var(--accent);text-decoration:none}
  h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:.1px}
  code,pre,.mono{font-family:var(--mono)}
  ::selection{background:rgba(58,118,224,.24)}

  /* 滚动进度 */
  #sprog{
    position:fixed;top:0;left:0;height:2px;width:0;z-index:99;
    background:linear-gradient(90deg,var(--accent),var(--cyan),var(--gold-2));
    box-shadow:0 0 12px rgba(58,118,224,.55);transition:width .12s linear;
  }

  /* ============================ HERO ============================ */
  .hero{
    position:relative;color:#EAF1FB;padding:46px 32px 40px;overflow:hidden;
    background:
      radial-gradient(1200px 520px at 14% -18%, rgba(58,118,224,.42), transparent 62%),
      radial-gradient(820px 380px at 88% -6%, rgba(56,178,206,.26), transparent 64%),
      radial-gradient(700px 420px at 70% 120%, rgba(192,138,46,.20), transparent 66%),
      linear-gradient(158deg,#071228 0%,#0C1E3C 46%,#143261 100%);
    border-bottom:1px solid rgba(255,255,255,.08);
  }

    opacity:.58;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.55) 30%,#000 62%,#000 100%);
    mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.55) 30%,#000 62%,#000 100%);
  }
  /* 压一层藏青，把插画拉回「工具」该有的克制，同时保证标题对比度 */
  .hero-art::after{
    content:"";position:absolute;inset:0;
    background:
      linear-gradient(90deg,rgba(7,18,40,.88) 0%,rgba(7,18,40,.50) 34%,rgba(10,24,52,.20) 100%),
      linear-gradient(180deg,rgba(7,18,40,.26) 0%,rgba(7,18,40,.12) 40%,rgba(7,18,40,.56) 100%);
  }
  #heroStars{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:.85;z-index:1}
  .hero-aurora{
    position:absolute;inset:-30% -10% auto -10%;height:120%;pointer-events:none;z-index:2;
    background:
      radial-gradient(46% 34% at 26% 34%, rgba(90,176,232,.30), transparent 70%),
      radial-gradient(38% 30% at 74% 24%, rgba(192,138,46,.20), transparent 72%);
    filter:blur(28px);animation:aurora 18s var(--ez) infinite alternate;
  }
  @keyframes aurora{
    0%{transform:translate3d(0,0,0) scale(1)}
    100%{transform:translate3d(-2.5%,2%,0) scale(1.07)}
  }
  .hero-in{position:relative;z-index:2;max-width:1240px;margin:0 auto}
  .brand-tag{
    display:inline-flex;align-items:center;gap:9px;
    font-family:var(--mono);font-size:11px;letter-spacing:2.6px;text-transform:uppercase;
    color:#A9C8F2;border:1px solid rgba(169,200,242,.32);border-radius:999px;
    padding:5px 14px;margin-bottom:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
    backdrop-filter:blur(6px);
    animation:riseIn .7s var(--ez-out) both;
  }
  .brand-tag i{
    width:6px;height:6px;border-radius:50%;background:#6FC6F0;display:block;
    box-shadow:0 0 12px #6FC6F0;animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.78)}}

  .hero h1{
    font-size:clamp(26px,3.4vw,38px);line-height:1.2;letter-spacing:.6px;
    animation:riseIn .8s .06s var(--ez-out) both;
  }
  .hero h1 .grad{
    background:linear-gradient(100deg,#7FC4F2 0%,#E6C577 52%,#F0D79B 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    background-size:220% 100%;animation:sheen 9s linear infinite;
  }
  @keyframes sheen{0%{background-position:0 0}100%{background-position:220% 0}}
  .hero .sub{
    color:#B7C8E2;margin-top:12px;font-size:14.5px;max-width:860px;line-height:1.78;
    animation:riseIn .8s .12s var(--ez-out) both;
  }
  .hero .sub strong{color:#F0C96A;font-weight:700}
  .hero-meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
  .chip{
    position:relative;border-radius:999px;padding:5px 13px;font-size:12.5px;color:#CBD9EE;
    background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.13);
    animation:riseIn .6s var(--ez-out) both;
    transition:transform .25s var(--ez), border-color .25s, background .25s;
  }
  .chip:hover{transform:translateY(-2px);border-color:rgba(127,196,242,.55);
    background:linear-gradient(180deg,rgba(127,196,242,.20),rgba(127,196,242,.06))}
  .chip b{color:#F0C96A;font-weight:700}
  .hero-note{
    margin-top:22px;padding:13px 16px;border-left:3px solid #5FA8E8;
    background:linear-gradient(90deg,rgba(95,168,232,.16),rgba(95,168,232,.04));
    border-radius:0 var(--r-s) var(--r-s) 0;font-size:12.9px;color:#BDD1EC;
    animation:riseIn .8s .24s var(--ez-out) both;
  }
  .hero-note b{color:#fff}
  .hero-rule{
    position:absolute;left:0;right:0;bottom:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(127,196,242,.75),rgba(240,201,106,.65),transparent);
    opacity:.7;
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ============================ TABS ============================ */
  .tabs{
    position:sticky;top:0;z-index:30;
    background:rgba(237,241,248,.82);backdrop-filter:blur(14px) saturate(1.4);
    border-bottom:1px solid var(--line);
  }
  .tabs-in{position:relative;max-width:1240px;margin:0 auto;display:flex;gap:2px;padding:0 32px;overflow-x:auto;scrollbar-width:none}
  .tabs-in::-webkit-scrollbar{display:none}
  .tab-pill{
    position:absolute;left:0;bottom:0;height:2.5px;border-radius:3px;
    background:linear-gradient(90deg,var(--accent),var(--cyan));
    box-shadow:0 0 14px rgba(58,118,224,.55);
    transition:transform .42s var(--ez-out), width .42s var(--ez-out);
    pointer-events:none;
  }
  .tab{
    position:relative;border:0;background:none;font-family:var(--sans);font-size:13.5px;font-weight:600;
    color:var(--muted);padding:15px 15px 13px;cursor:pointer;white-space:nowrap;
    transition:color .22s var(--ez), transform .22s var(--ez);
  }
  .tab:hover{color:var(--ink-2);transform:translateY(-1px)}
  .tab.on{color:var(--navy)}
  .tab .n{font-family:var(--mono);font-size:11px;color:var(--muted-2);margin-right:7px;transition:color .22s}
  .tab.on .n{color:var(--accent)}

  /* ============================ LAYOUT ============================ */
  main{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:28px 32px 76px}
  .view{display:none}
  .view.on{display:block}

  /* 卡片：错峰进场 */
  .view.on .card{animation:cardIn .62s var(--ez-out) both}
  .view.on .card:nth-child(1){animation-delay:.02s}
  .view.on .card:nth-child(2){animation-delay:.09s}
  .view.on .card:nth-child(3){animation-delay:.16s}
  .view.on .card:nth-child(4){animation-delay:.23s}
  .view.on .card:nth-child(5){animation-delay:.30s}
  .view.on .card:nth-child(n+6){animation-delay:.36s}
  @keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.994)}to{opacity:1;transform:none}}

  .card{
    position:relative;background:linear-gradient(180deg,var(--surface) 0%,#FBFCFE 100%);
    border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-2);
    padding:22px 24px;margin-bottom:18px;
    transition:transform .32s var(--ez), box-shadow .32s var(--ez), border-color .32s var(--ez);
  }
  /* 顶部强调线：hover 时从左展开 */
  .card::before{
    content:"";position:absolute;left:18px;right:18px;top:-1px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--accent),var(--cyan),transparent);
    transform:scaleX(0);transform-origin:left;opacity:0;
    transition:transform .5s var(--ez-out), opacity .3s;
  }
  .card:hover{transform:translateY(-2px);box-shadow:var(--sh-3);border-color:var(--line-3)}
  .card:hover::before{transform:scaleX(1);opacity:.9}
  .card.tight{padding:16px 18px}

  .card-h{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:15px;flex-wrap:wrap}
  .card-h h3{font-size:16px;letter-spacing:.2px}
  .card-h .hint{font-size:12.5px;color:var(--muted)}
  .eyebrow{
    font-family:var(--mono);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:7px;
  }
  .eyebrow::before{content:"";display:inline-block;width:14px;height:1.5px;background:var(--accent);
    vertical-align:middle;margin-right:8px;opacity:.75;border-radius:2px}
  /* 卡片进场时引导线从 0 生长，给标题一个「起笔」的感觉 */
  .view.on .card .eyebrow::before{animation:ruleIn .68s .14s var(--ez-out) both}
  @keyframes ruleIn{from{width:0;opacity:0}to{width:14px;opacity:.75}}
  .grid{display:grid;gap:15px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:1000px){.g4,.g3{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:680px){.g2,.g3,.g4{grid-template-columns:1fr}main{padding:18px 16px 60px}
    .tabs-in{padding:0 16px}.hero{padding:30px 18px 28px}}

  /* ============================ KPI ============================ */
  .kpi{
    position:relative;background:linear-gradient(180deg,#fff,#F8FAFE);
    border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;overflow:hidden;
    transition:transform .3s var(--ez), box-shadow .3s var(--ez);
  }
  .kpi::after{
    content:"";position:absolute;right:-28px;top:-28px;width:78px;height:78px;border-radius:50%;

    transition:transform .45s var(--ez);
  }
  .kpi:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
  .kpi:hover::after{transform:scale(1.5)}

  .kpi .desc{font-size:11.5px;color:var(--muted-2);margin-top:6px}
  .kpi.good .val{color:var(--ok)} .kpi.bad .val{color:var(--bad)} .kpi.warn .val{color:var(--warn)}
  .kpi.accent .val{color:var(--accent)}

  /* ============================ BADGE ============================ */
  .badge{

  .b-ok{background:var(--ok-soft);color:var(--ok);border-color:#B9E4D0}

  .b-warn{background:var(--warn-soft);color:var(--warn);border-color:#EFDAB4}

  .b-gold{background:var(--gold-soft);color:var(--gold);border-color:#EBD7A9}

  /* ============================ TABLE ============================ */
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}

  th{

  .tbl-wrap{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-s);background:#fff}

    overflow:hidden;
  }
  button.btn:hover{border-color:#BCCDE8;background:#FBFDFF;transform:translateY(-1px);box-shadow:var(--sh-1)}

  button.btn.primary{
    background:linear-gradient(158deg,var(--navy-2),var(--navy));border-color:var(--navy);color:#fff;
    box-shadow:0 6px 20px -10px rgba(21,48,96,.85);
  }
  button.btn.primary:hover{
    background:linear-gradient(158deg,var(--navy-3),var(--navy-2));border-color:var(--navy-2);
    box-shadow:0 10px 26px -10px rgba(29,62,120,.9);
  }
  button.btn.gold{background:#fff;border-color:#E5D0A0;color:var(--gold)}
  button.btn.gold:hover{background:var(--gold-soft)}

  button.btn.sm{font-size:12.5px;padding:7px 12px}

  /* 分段控件：滑动药丸 */
  .seg{position:relative;display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;
    background:linear-gradient(180deg,#F7F9FD,#EFF3FA);gap:2px}
  .seg .seg-pill{
    position:absolute;top:3px;bottom:3px;left:0;border-radius:999px;z-index:0;
    background:linear-gradient(158deg,var(--navy-2),var(--navy));

    transition:transform .4s var(--ez-out), width .4s var(--ez-out), background .3s;
  }
  .seg .seg-pill.v1{background:linear-gradient(158deg,#6E7C96,#55637C)}
  .seg button{
    position:relative;z-index:1;border:0;background:none;font-family:var(--sans);font-size:12.5px;font-weight:600;
    color:var(--muted);padding:6px 15px;border-radius:999px;cursor:pointer;transition:color .25s var(--ez)
  }
  .seg button.on{color:#fff}

  /* ============================ FORM ============================ */
  input.field,textarea.field{

  /* ============================ ANSWER ============================ */
  .answer{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;position:relative}
  .answer::before{
    content:"";position:absolute;top:0;left:0;right:0;height:2px;z-index:2;
    background:linear-gradient(90deg,transparent,var(--accent-2),var(--cyan),transparent);
    background-size:220% 100%;animation:scan 3.4s linear infinite;
  }
  @keyframes scan{0%{background-position:-120% 0}100%{background-position:220% 0}}
  .answer-h{
    background:linear-gradient(120deg,#0C1E3C,#17376C);color:#E9F1FC;padding:11px 16px;

  }

  .answer-b{
    padding:17px 19px;white-space:pre-wrap;font-size:13.7px;line-height:1.82;color:var(--ink-2);

  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .answer-b .cite{color:var(--accent);font-weight:700}
  .refuse{border-left:3px solid var(--warn);background:linear-gradient(90deg,var(--warn-soft),#fff 42%)}

  /* ============================ EVIDENCE ============================ */
  .evi{
    position:relative;border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;margin-bottom:10px;
    background:linear-gradient(180deg,#fff,#FBFCFE);
    transition:transform .26s var(--ez), box-shadow .26s var(--ez), border-color .26s;
    animation:fadeUp .5s var(--ez-out) both;
  }
  .evi:hover{transform:translateX(3px);box-shadow:var(--sh-2);border-color:var(--line-3)}
  .evi .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .evi .t{font-weight:700;font-size:13.2px}
  .evi .score{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .bar{height:5px;border-radius:3px;background:#EDF1F8;margin-top:9px;overflow:hidden}
  .bar i{
    display:block;height:100%;border-radius:3px;width:0;
    background:linear-gradient(90deg,var(--accent-2),var(--accent));

  }
  .evi .snip{font-size:12.3px;color:var(--muted);margin-top:8px;line-height:1.62}
  .evi .meta{font-size:11.2px;color:var(--muted-2);margin-top:8px;font-family:var(--mono)}

  /* ============================ PROMPT ============================ */
  pre.prompt{
    background:linear-gradient(180deg,#0B1830,#0E1F3D);color:#C3D8F3;border-radius:var(--r-s);
    padding:16px 18px;font-size:12.2px;line-height:1.75;overflow:auto;max-height:340px;
    white-space:pre-wrap;border:1px solid #1E3760;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  }

  /* ============================ FLOW ============================ */
  .flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:900px){.flow{grid-template-columns:1fr 1fr}}
  .step{
    position:relative;background:linear-gradient(180deg,#fff,#F9FBFE);border:1px solid var(--line);
    border-radius:var(--r-s);padding:15px 16px;overflow:hidden;
    transition:transform .3s var(--ez), box-shadow .3s var(--ez), border-color .3s;
  }
  .step::after{
    content:"";position:absolute;inset:auto -30% -60% auto;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle,rgba(58,118,224,.13),transparent 70%);
    transition:transform .5s var(--ez);
  }
  .step:hover{transform:translateY(-4px);box-shadow:var(--sh-2);border-color:var(--line-3)}
  .step:hover::after{transform:scale(1.6)}
  .step .idx{
    font-family:var(--mono);font-size:11px;color:#fff;border-radius:6px;padding:2px 8px;display:inline-block;
    margin-bottom:9px;background:linear-gradient(150deg,var(--navy-2),var(--navy));
    box-shadow:0 4px 12px -6px rgba(21,48,96,.9)
  }
  .step h4{font-size:13.8px;margin-bottom:6px;position:relative}
  .step p{margin:0;font-size:12.3px;color:var(--muted);line-height:1.62;position:relative}
  /* 让「闭环」这件事被看见：编号 01→04 依次点亮，像一圈信号在跑 */
  .step .idx{animation:stepLive 4s var(--ez) infinite}
  .step:nth-child(2) .idx{animation-delay:1s}
  .step:nth-child(3) .idx{animation-delay:2s}
  .step:nth-child(4) .idx{animation-delay:3s}
  /* 0% 必须是「未点亮」态，否则循环回卷时会硬切 */
  @keyframes stepLive{
    0%  {background:linear-gradient(150deg,var(--navy-2),var(--navy));
         box-shadow:0 0 0 0 rgba(58,118,224,0);transform:none}
    4%  {background:linear-gradient(150deg,var(--accent-2),var(--accent));
         box-shadow:0 0 0 0 rgba(58,118,224,.50);transform:translateY(-2px)}
    11% {box-shadow:0 0 0 8px rgba(58,118,224,0)}
    23% {background:linear-gradient(150deg,var(--accent-2),var(--accent));
         box-shadow:0 0 0 0 rgba(58,118,224,0);transform:translateY(-2px)}
    31%,100%{background:linear-gradient(150deg,var(--navy-2),var(--navy));
         box-shadow:0 0 0 0 rgba(58,118,224,0);transform:none}
  }

  /* ============================ NOTE ============================ */
  .note{
    border-left:3px solid var(--accent);background:linear-gradient(90deg,var(--accent-soft),rgba(233,241,254,.32));

  ul.plain{margin:9px 0 0;padding-left:20px;font-size:13.2px;color:var(--ink-2)}

  .cmp-col.v2 .hd{background:linear-gradient(180deg,#E9F1FE,#DCE9FC);color:#1D4E9C;border-bottom:1px solid #D2E1F8}
  .cmp-col .bd{padding:12px 14px;font-size:12.4px;line-height:1.7;white-space:pre-wrap;color:var(--ink-2);
    max-height:260px;overflow:auto}

  .legend{display:flex;flex-wrap:wrap;gap:15px;font-size:12px;color:var(--muted);margin-top:9px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:3px;display:inline-block}

  .kv{display:grid;grid-template-columns:120px 1fr;gap:7px 12px;font-size:12.6px}
  .kv dt{color:var(--muted)} .kv dd{margin:0;color:var(--ink-2)}

  footer{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 32px 56px;color:var(--muted-2);font-size:12px}

  .spin{display:inline-block;width:13px;height:13px;border:2px solid #CBD8EA;border-top-color:var(--accent);
    border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}

  .mtable td.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.3px}
  .delta.up{color:var(--ok);font-weight:700} .delta.down{color:var(--bad);font-weight:700}

  /* 表格里的小进度条：让「覆盖率」这类比例在扫读时直接可感 */
  .mbar{height:5px;border-radius:3px;background:#EDF1F8;overflow:hidden;min-width:52px}

    background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width 1s var(--ez-out)}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important}

  }
</style>

      keywords: ["弱点", "削韧", "韧性", "弱点击破怎么触发"],
      content: "敌方单位拥有韧性条，只有使用与敌人弱点一致的属性攻击时才可削减其韧性；非弱点属性攻击不削韧。当韧性被削减至零，敌人进入「击破状态」，立即承受一次击破伤害，并附加与击破属性对应的减益效果（例如火属性击破造成灼烧）。敌人恢复行动后韧性条重置。因此配队的属性覆盖率直接决定战斗效率。",
      points: ["只有弱点属性攻击可削韧", "韧性清零进入击破状态", "击破会附加对应属性减益", "敌人行动后韧性重置"],
      source: "游戏内战斗教学与战斗机制实测", srcType: "官方", version: "通用", date: "2026-10-15", status: "有效",
      topics: ["韧性击破"]
    },
    {
      id: "KB-M03", cat: "核心机制", title: "击破特攻与超击破",
      keywords: ["击破特攻", "击破伤害", "超击破", "击破特攻有什么用", "击破条"],
      content: "击破特攻（Break Effect）提升两件事：一是击破瞬间造成的击破伤害，二是击破后附加减益（如灼烧、冻结、纠缠等）的强度与持续时间。超击破是另一套机制：由特定角色（例如「开拓者·同谐」形态）提供，在敌方已处于击破状态时，其受到的削韧伤害会额外触发一段超击破伤害，该伤害同样受击破特攻加成。因此击破体系的收益集中在「快速削韧」与「堆高击破特攻」两件事上，暴击率与暴击伤害对击破、超击破伤害基本不生效。",
      points: ["击破特攻提升击破伤害与击破减益", "超击破由特定角色提供", "超击破在敌方被击破状态下触发", "击破伤害不吃暴击双爆"],
      source: "游戏内技能描述与官方机制说明整理", srcType: "官方", version: "通用", date: "2026-10-15", status: "有效",

    {
      id: "KB-M04", cat: "核心机制", title: "伤害类型与乘区",

      content: "游戏内伤害分为三类：直伤（普攻、战技、终结技、追加攻击，吃暴击与增伤）、持续伤害（DoT，如灼烧、风化，通常不吃暴击与增伤的部分乘区，主要吃攻击力与对应增伤）、击破与超击破伤害（吃击破特攻）。一次伤害的最终值由基础伤害、属性伤害加成、增伤、防御、抗性、易伤、减防等多个乘区连乘得到，因此「堆一条高收益词条」与「补齐缺失乘区」两种思路在实战中效果不同。",
      points: ["直伤吃暴击与增伤", "持续伤害通常不吃双爆", "击破与超击破吃击破特攻", "最终伤害是多乘区连乘"],
      source: "游戏机制实测与官方说明整理", srcType: "官方", version: "通用", date: "2026-10-15", status: "有效",
      topics: ["伤害机制"]

    {

      content: "战斗采用行动值（Action Value）机制，单位行动值 = 10000 / 速度。速度越高，行动值越小，出手越快。速度存在「阈值」概念：达到某个速度后，单位在一轮固定行动值内可多行动一次（例如从两动变为三动），因此堆速度常追求跨过阈值而非线性提升。拉条类角色（如布洛妮娅）可让队友行动提前，等同于临时改变行动顺序。",
      points: ["行动值 = 10000 / 速度", "速度越高出手越快", "速度存在阈值而非线性收益", "拉条可让队友行动提前"],
      source: "游戏内战斗机制与社区数值验证整理", srcType: "官方", version: "通用", date: "2026-10-15", status: "有效",

      content: "角色通过普攻、战技、被击、队友增益等方式获取能量，能量满后可释放终结技。能量恢复效率（充能）提升所有能量获取量，是辅助与关键输出角色的核心属性之一。实战中常以「几动一大」（多少回合行动可攒满一次终结技）衡量循环舒适度，达不到循环阈值时，堆再高的输出词条也无法转化为实际伤害。",
      points: ["能量来自普攻战技被击与增益", "能量恢复效率提升充能速度", "循环阈值决定终结技频率", "循环不足时输出词条收益受限"],
      source: "游戏内战斗机制整理", srcType: "官方", version: "通用", date: "2026-10-15", status: "有效",
      topics: ["能量体系"]
    },

      content: "秘技是战斗外使用的技能，消耗秘技点（通过探索、战斗或补给获得），可在大世界或战斗开始前触发效果，例如直接对敌人造成削韧、施加负面效果、为我方提供增益或直接击破。合理使用秘技可以显著降低开局难度，是高难副本的常见开局手法。",

    {

    {

      content: "主词条按部位区分。头固定生命值、手固定攻击力，其余部位可选：躯干可选暴击率、暴击伤害、攻击力%、治疗量加成、效果命中、生命值%、防御力%；脚部可选速度、攻击力%、生命值%、防御力%；位面球可选各属性伤害加成、生命值%、防御力%、攻击力%；连结绳可选攻击力%、生命值%、防御力%、能量恢复效率、击破特攻。按定位选择：直伤主 C 躯干优先暴击率或暴击伤害；持续伤害角色躯干选攻击力%；治疗选治疗量加成；效果命中型辅助选效果命中；生存位按护盾或治疗倍率选生命值%或防御力%。脚部方面主 C 在需要行动频率时选速度鞋，辅助通常必选速度鞋。位面球主 C 选对应属性伤害球，辅助与生存位选生命值%或防御力%。连结绳依赖终结技的角色选能量恢复效率，输出选攻击力%，击破体系选击破特攻。",

/* ===== src/engine.js ===== */
/* ============================================================
 * Game Agent Lab · 问答与评测引擎
 * ------------------------------------------------------------
 * 本引擎完全离线运行，不调用任何外部大模型。
 * 「检索增强问答」由真实实现的 BM25 检索 + 策略化答案合成完成，
 * 因此所有评测指标都可复现、可核查。
 *
 * 两套策略（用于迭代前后对比）
 *  v1 初版策略：知识库尚未覆盖范围边界与冲突样本，无引用、无拒答阈值、
 *              无时效标记 → 「什么都能答，但答案不可核查」
 *  v2 优化策略：补齐边界/冲突/过期条目 + 强制引用 + 拒答阈值 + 时效过滤
 *              + 多来源冲突提示
 * ============================================================ */

(function () {
  "use strict";

  /* ---------------- 1. 中文友好分词 ---------------- */
  const STOP = new Set(["的", "了", "是", "在", "有", "和", "与", "吗", "呢", "啊", "我", "你",
    "怎么", "什么", "如何", "哪些", "哪个", "多少", "这个", "那个", "一下", "可以", "需要",
    "要", "会", "能", "把", "被", "给", "对", "为", "就", "都", "也", "还", "但", "而", "用"]);

  function tokenize(text) {
    const s = String(text || "").toLowerCase();
    const tokens = [];
    (s.match(/[a-z0-9]+/g) || []).forEach((w) => { if (w.length > 1) tokens.push(w); });
    (s.match(/[\u4e00-\u9fa5]+/g) || []).forEach((run) => {
      for (let i = 0; i < run.length; i++) {
        tokens.push(run[i]);
        if (i + 1 < run.length) tokens.push(run.slice(i, i + 2));
      }
    });
    return tokens.filter((t) => t.length > 0);
  }

  function queryTerms(text) {
    return tokenize(text).filter((t) => !STOP.has(t));
  }

  function bigrams(text) {
    const s = String(text || "").toLowerCase().replace(/[\s\p{P}]+/gu, "");
    const out = [];
    for (let i = 0; i < s.length; i++) {
      if (i + 1 < s.length) out.push(s.slice(i, i + 2));
      else out.push(s[i]);
    }
    return out;
  }

  function overlapRatio(needle, haystack) {
    const a = bigrams(needle);
    const b = new Set(bigrams(haystack));
    if (a.length === 0) return 0;
    let hit = 0;
    a.forEach((g) => { if (b.has(g)) hit += 1; });
    return hit / a.length;
  }

  /* ---------------- 2. 索引与 BM25 ---------------- */
  const FIELD_WEIGHT = { title: 3.0, keywords: 2.6, topics: 1.6, content: 1.0, points: 1.2 };

  function buildIndex(entries) {
    const docs = [];
    const df = Object.create(null);
    entries.forEach((e) => {
      const wf = Object.create(null);
      const add = (txt, w) => { tokenize(txt).forEach((t) => { wf[t] = (wf[t] || 0) + w; }); };
      add(e.title, FIELD_WEIGHT.title);
      add((e.keywords || []).join(" "), FIELD_WEIGHT.keywords);
      add((e.topics || []).join(" "), FIELD_WEIGHT.topics);
      add(e.content, FIELD_WEIGHT.content);
      add((e.points || []).join(" "), FIELD_WEIGHT.points);
      let len = 0;
      Object.keys(wf).forEach((t) => { len += wf[t]; });
      docs.push({ id: e.id, wf, len });
      Object.keys(wf).forEach((t) => { df[t] = (df[t] || 0) + 1; });
    });
    const N = docs.length;
    let avgLen = 0;
    docs.forEach((d) => { avgLen += d.len; });
    avgLen = avgLen / Math.max(N, 1);
    const idf = Object.create(null);
    Object.keys(df).forEach((t) => { idf[t] = Math.log(1 + (N - df[t] + 0.5) / (df[t] + 0.5)); });
    return { docs, idf, avgLen, N, docById: docs.reduce((m, d) => (m[d.id] = d, m), Object.create(null)) };
  }

  const K1 = 1.5, B = 0.72;

  function scoreDoc(doc, terms, idf, avgLen) {
    let score = 0;
    terms.forEach((t) => {
      const tf = doc.wf[t];
      if (!tf) return;
      const w = idf[t] || Math.log(2);
      score += w * (tf * (K1 + 1)) / (tf + K1 * (1 - B + B * (doc.len / avgLen)));
    });
    return score;
  }

  /* ---------------- 3. 策略定义 ---------------- */
  const STRATEGIES = {
    v1: {
      key: "v1", name: "v1 · 初版策略",
      note: "知识库尚未建立范围边界与冲突样本；无引用、无拒答阈值、无时效标记。",
      topK: 3,
      excludeCats: ["边界样本", "冲突样本"],
      useFreshness: false,
      emitCitations: false,
      refuseThreshold: 0,
      refuseMinScore: 0,
      warnConflict: false,
      warnStale: false,
      structured: false,
      prompt: [
        "你是一个游戏问答助手。用户会提出关于《崩坏：星穹铁道》的问题。",
        "请从下面提供的资料中找出相关内容并回答用户。",
        "",
        "【资料】",
        "{{CONTEXT}}",
        "",
        "【用户问题】{{QUESTION}}",
        "",
        "【要求】直接回答，语言简洁。"
      ].join("\n")
    },
    v2: {
      key: "v2", name: "v2 · 优化策略",
      note: "补齐边界/冲突/过期条目；强制引用来源、设置拒答阈值、过滤过期资料、提示资料冲突。",
      topK: 5,
      excludeCats: [],
      useFreshness: true,
      emitCitations: true,
      refuseThreshold: 0.20,     // 覆盖率兜底阈值
      refuseMinScore: 25,        // 检索置信度下限（在自建知识库上校准，低于此值视为无依据）
      warnConflict: true,
      warnStale: true,
      structured: true,
      prompt: [
        "你是《崩坏：星穹铁道》的知识库问答 Agent。你的回答必须完全基于检索到的资料，不得引入资料之外的记忆。",
        "",
        "【执行规则】",
        "1. 只依据下方资料作答；资料未覆盖的内容一律不推测。",
        "2. 每条结论后必须标注引用编号，格式 [KB-xx]。",
        "3. 若资料之间存在冲突：优先采用「来源类型＝官方」且版本最新的条目，并明确提示存在冲突说法。",
        "4. 若命中的资料 status＝已过期：必须提示该资料版本，并说明不能直接套用到当前版本。",
        "5. 若检索覆盖率低于阈值，或问题超出知识库覆盖范围（其他游戏／未来版本／不存在的内容）：",
        "   必须拒答，说明「知识库未收录」，并给出获取准确信息的建议渠道。",
        "6. 禁止用相近概念迁移作答（例如用「遗器」回答「驱动盘」的问题）。",
        "",
        "【输出结构】",
        "结论 → 依据（分条，含 [KB-xx] 与来源/版本）→ 风险提示（如有）→ 来源汇总",
        "",
        "【资料】",
        "{{CONTEXT}}",
        "",
        "【用户问题】{{QUESTION}}"
      ].join("\n")
    }
  };

  /* ---------------- 4. 检索 ---------------- */
  function makeRetriever(kb) {
    const index = buildIndex(kb.entries);
    const byId = Object.create(null);
    kb.entries.forEach((e) => { byId[e.id] = e; });

    function retrieve(question, strategy, opts) {
      opts = opts || {};
      let terms = Array.from(new Set(queryTerms(question)));

      // 扰动：去掉权重最高的查询词，模拟「换一种说法问同一件事」
      if (opts.perturb && terms.length > 1) {
        let maxT = terms[0], maxW = -1;
        terms.forEach((t) => { const w = index.idf[t] || 0; if (w > maxW) { maxW = w; maxT = t; } });
        terms = terms.filter((t) => t !== maxT);
      }

      const pool = index.docs.filter((d) => !strategy.excludeCats.includes(byId[d.id].cat));
      const scored = pool.map((d) => {
        const e = byId[d.id];
        let s = scoreDoc(d, terms, index.idf, index.avgLen);
        if (strategy.useFreshness) {
          if (e.srcType === "官方") s *= 1.18;
          if (e.status === "待复核") s *= 0.94;
        }
        return { entry: e, score: s };
      }).filter((r) => r.score > 0);
      scored.sort((a, b) => b.score - a.score);

      // 检索覆盖率：命中词权重 / 查询词权重（基于 top-1 命中条目）
      let totW = 0, hitW = 0;
      const top = scored[0];
      const topDoc = top ? index.docById[top.entry.id] : null;
      Array.from(new Set(queryTerms(question))).forEach((t) => {
        const w = index.idf[t] || Math.log(2);
        totW += w;
        if (topDoc && topDoc.wf[t]) hitW += w;
      });
      const coverage = totW > 0 ? hitW / totW : 0;

      return {
        results: scored.slice(0, strategy.topK),
        coverage,
        qTerms: terms,
        totalHits: scored.length,
        topScore: top ? top.score : 0,
        topEntryId: top ? top.entry.id : null
      };
    }
    return { retrieve, byId, index };
  }

  /* ---------------- 5. 风险识别 ---------------- */
  function detectWarnings(usedEntries, strategy) {
    const flags = [];
    const core = usedEntries;
    if (strategy.warnStale) {
      const stale = core.filter((e) => e.status === "已过期");
      if (stale.length) {
        flags.push({
          type: "stale",
          text: "检索到的资料中 " + stale.map((e) => e.id + "（" + e.version + " 版本）").join("、") +
                " 已被标记为过期，仅适用于当时版本，不能直接套用到当前 4.6 版本，请以当期官方信息为准。"
        });
      }
    }
    if (strategy.warnConflict) {
      const conflictSamples = core.filter((e) => e.cat === "冲突样本");
      conflictSamples.forEach((cs) => {
        const official = usedEntries.filter((e) =>
          e.id !== cs.id && e.srcType === "官方" && (e.topics || []).some((t) => (cs.topics || []).indexOf(t) >= 0));
        if (official.length) {
          flags.push({
            type: "conflict",
            text: "关于「" + cs.topics.join("、") + "」存在互相冲突的资料：" +
                  cs.id + "（" + cs.srcType + "）的说法与 " +
                  official.map((e) => e.id + "（官方）").join("、") +
                  " 不一致。此处按「来源类型＝官方」优先取值，并保留冲突记录备查。"
          });
        }
      });
    }
    return flags;
  }

  /* ---------------- 6. 答案合成 ---------------- */
  function composeAnswer(question, ret, strategy) {
    const entries = ret.results.map((r) => r.entry);

    let refused = false, refuseReason = "";
    if (strategy.refuseThreshold > 0) {
      const boundary = entries[0] && entries[0].cat === "边界样本";
      if (boundary) {
        refused = true;
        refuseReason = entries[0].id === "KB-X04"
          ? "该问题涉及未来版本或未公开内容，知识库快照截至 4.6 版本，没有可靠依据，不作推测。"
          : "该问题超出了本知识库的覆盖范围（本知识库仅覆盖《崩坏：星穹铁道》，不覆盖其他游戏或其他游戏的对应系统）。";
      } else if (ret.coverage < strategy.refuseThreshold ||
                 (strategy.refuseMinScore > 0 && ret.topScore < strategy.refuseMinScore) ||
                 entries.length === 0) {
        refused = true;
        refuseReason = "知识库中未收录可以支撑该问题的资料（检索置信度低于校准阈值），为避免给出不可核查的答案，这里不作推测。";
      }
    }

    if (refused) {
      const text = strategy.structured
        ? "【结论】无法依据现有知识库回答该问题。\n【说明】" + refuseReason +
          "\n【建议】请以官方公告、版本更新说明或游戏内说明为准，并可在知识库补充相应资料后重新询问。"
        : "抱歉，这个问题我暂时没有找到相关资料。";
      const cite = strategy.emitCitations && entries.length && entries[0].cat === "边界样本" ? [entries[0].id] : [];
      return { text, display: text, refused: true, citations: cite, flags: [], used: cite.slice(), coverage: ret.coverage, topEntryId: ret.topEntryId };
    }

    const useN = strategy.structured ? 3 : 2;
    const usedEntries = entries.slice(0, useN);
    const flags = detectWarnings(usedEntries, strategy);
    const citations = strategy.emitCitations ? usedEntries.map((e) => e.id) : [];

    if (!strategy.structured) {
      const full = usedEntries.map((e) => e.content).join("\n");
      const clip = (s, n) => (s.length > n ? s.slice(0, n) + "…" : s);
      return {
        text: full,
        display: usedEntries.map((e) => clip(e.content, 230)).join("\n\n") +
                 (full.length > 460 ? "\n\n（v1 直接输出最相似资料原文，未做结构化拆分）" : ""),
        refused: false, citations: [], flags: [],
        used: usedEntries.map((e) => e.id), coverage: ret.coverage, topEntryId: ret.topEntryId
      };
    }

    const lines = [];
    lines.push("【结论】" + entries[0].points[0] + "。");
    lines.push("");
    lines.push("【依据】");
    usedEntries.forEach((e, i) => {
      const pts = e.points.slice(0, i === 0 ? 7 : 4).map((p) => "  · " + p).join("\n");
      lines.push("· " + e.title + " [" + e.id + "]");
      lines.push(pts);
      lines.push("  （来源：" + e.source + "｜" + e.srcType + "｜版本 " + e.version + "｜" + e.date +
                 (e.status !== "有效" ? "｜状态 " + e.status : "") + "）");
    });
    if (flags.length) {
      lines.push("");
      lines.push("【风险提示】");
      flags.forEach((f) => lines.push("  ⚠ " + f.text));
    }
    lines.push("");
    lines.push("【来源汇总】" + usedEntries.map((e) => e.id + "（" + e.source + "）").join("；"));
    const text = lines.join("\n");
    return {
      text, display: text, refused: false, citations, flags,
      used: usedEntries.map((e) => e.id), coverage: ret.coverage, topEntryId: ret.topEntryId
    };
  }

  /* ---------------- 7. 单题评测 ---------------- */
  function behaviorOf(out) {
    if (out.refused) return "refuse";
    if (out.flags && out.flags.length) return "flag:" + out.flags.map((f) => f.type).sort().join("+");
    return "answer";
  }

  function runCase(c, strategy, retriever, opts) {
    opts = opts || {};
    const ret = retriever.retrieve(c.question, strategy, opts);
    const out = composeAnswer(c.question, ret, strategy);
    const exp = c.expect;

    const actualBehavior = behaviorOf(out);

    let behaviorOK;
    if (exp.behavior === "refuse") behaviorOK = out.refused;
    else if (exp.behavior === "flag") behaviorOK = !out.refused && !!out.flags.find((f) => f.type === exp.warn);
    else behaviorOK = !out.refused;

    // 评分文本 = 答案正文 + 风险提示（风险提示同样是模型输出的一部分）
    const matchText = out.text + "\n" + (out.flags || []).map((f) => f.text).join("\n");

    let pointsCovered;
    if (exp.behavior === "refuse" && out.refused) {
      pointsCovered = 1; // 正确拒答即视为满足该题要点
    } else if (exp.points.length === 0) {
      pointsCovered = out.refused ? 1 : 0;
    } else {
      pointsCovered = exp.points.filter((p) => overlapRatio(p, matchText) >= 0.5).length / exp.points.length;
    }

    const refsHit = exp.refs.filter((r) => out.citations.includes(r));
    const refsOK = exp.refs.length === 0 ? true : refsHit.length > 0;

    const traceOK = out.refused ? out.citations.length > 0 : out.citations.length > 0;

    // 时效性：只要没有把过期资料「当作有效结论」直接使用即算合格。
    // 若引用了过期资料、但同时给出了过期提示，则属于正确处理，不扣分。
    const usedStale = out.used.some((id) => retriever.byId[id] && retriever.byId[id].status === "已过期");
    const warnedStale = (out.flags || []).some((f) => f.type === "stale");
    const freshOK = out.refused ? true : (!usedStale || warnedStale);

    // 两级判定：内容通过（不看引用） vs 完整验收（内容 + 依据可追溯）
    const passedContent = behaviorOK && pointsCovered >= 0.5;
    const passed = passedContent && refsOK;

    let cause = "";
    if (!behaviorOK) {
      if (exp.behavior === "refuse") cause = "未拒答：知识库缺少范围边界条目／提示词未设置拒答阈值";
      else if (exp.warn === "conflict") cause = "未提示冲突：缺少冲突样本条目／未做多来源交叉校验";
      else if (exp.warn === "stale") cause = "未提示过期：未维护版本时效标记／未做时效过滤";
      else cause = "行为与预期不符";
    } else if (pointsCovered < 0.5) {
      cause = exp.reasoning
        ? "跨条目推理缺失：当前引擎只做条目召回与拼装，无法生成对比/推导结论"
        : "要点覆盖不足：检索召回不足或答案未结构化拆分要点";
    } else if (!refsOK) {
      cause = "引用缺失：提示词未要求标注来源，答案不可回溯";
    }

    return {
      case: c, out, ret, actualBehavior, behaviorOK, pointsCovered,
      refsOK, refsHit, traceOK, freshOK, passed, passedContent, cause, flags: out.flags || []
    };
  }

  /* ---------------- 8. 整套评测 ---------------- */
  function evaluate(strategy, retriever, cases) {
    const results = cases.map((c) => runCase(c, strategy, retriever));

    const acc = results.filter((r) => r.behaviorOK).length / results.length;
    const comp = results.reduce((s, r) => s + r.pointsCovered, 0) / results.length;
    const trace = results.filter((r) => r.traceOK).length / results.length;
    const fresh = results.filter((r) => r.freshOK).length / results.length;

    // 稳定性：换一种问法（去掉权重最高的查询词）后，行为与首要依据条目是否一致
    const stabilityRuns = cases.map((c) => {
      const a = runCase(c, strategy, retriever);
      const b = runCase(c, strategy, retriever, { perturb: true });
      const sameBehavior = behaviorOf(a.out) === behaviorOf(b.out);
      const sameTop = (a.out.topEntryId || "-") === (b.out.topEntryId || "-");
      return { id: c.id, consistent: sameBehavior && sameTop,
               a: behaviorOf(a.out), b: behaviorOf(b.out),
               aTop: a.out.topEntryId, bTop: b.out.topEntryId };
    });
    const stab = stabilityRuns.filter((r) => r.consistent).length / stabilityRuns.length;

    const metrics = { accuracy: acc, completeness: comp, traceability: trace, freshness: fresh, stability: stab };
    metrics.overall = acc * 0.35 + comp * 0.20 + trace * 0.15 + fresh * 0.15 + stab * 0.15;

    const byType = {};
    results.forEach((r) => {
      const t = r.case.type;
      byType[t] = byType[t] || { n: 0, pass: 0, passContent: 0 };
      byType[t].n += 1;
      if (r.passed) byType[t].pass += 1;
      if (r.passedContent) byType[t].passContent += 1;
    });

    const causeAgg = {};
    results.filter((r) => !r.passed).forEach((r) => {
      const key = r.cause || "其他";
      causeAgg[key] = (causeAgg[key] || 0) + 1;
    });

    return {
      strategy: strategy.key, results, metrics, byType, causeAgg, stabilityRuns,
      passCount: results.filter((r) => r.passed).length,
      passContentCount: results.filter((r) => r.passedContent).length,
      total: results.length
    };
  }

  /* ---------------- 9. 对外接口 ---------------- */
  function createEngine(kb, testset) {
    const retriever = makeRetriever(kb);
    return {
      kb, testset, retriever, STRATEGIES, FIELD_WEIGHT,
      ask(question, strategyKey) {
        const st = STRATEGIES[strategyKey] || STRATEGIES.v2;
        const ret = retriever.retrieve(question, st);
        const out = composeAnswer(question, ret, st);
        return Object.assign({ retrieved: ret, strategy: st }, out);
      },
      evaluate(strategyKey) {
        const st = STRATEGIES[strategyKey] || STRATEGIES.v2;
        return evaluate(st, retriever, testset.cases);
      },
      tokenize, queryTerms
    };
  }

  window.ENGINE = { createEngine, STRATEGIES, tokenize, overlapRatio, bigrams };
})();

/* ============================================================
 * Game Agent Lab · 界面逻辑
 * 依赖：kb.js / testset.js / engine.js
 * ============================================================ */
(function () {
  "use strict";

  const KB = window.KB, TS = window.TESTSET;
  const engine = window.ENGINE.createEngine(KB, TS);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  const METRIC_DEF = [
    { key: "accuracy",     label: "准确性",     desc: "行为是否符合预期（该答的答、该拒的拒、该提示的提示）" },
    { key: "completeness", label: "完整性",     desc: "标准答案要点被覆盖的比例" },
    { key: "traceability", label: "依据可追溯", desc: "答案是否标注了可回溯的知识库来源" },
    { key: "freshness",    label: "时效性",     desc: "作答未引用已过期资料的比例" },
    { key: "stability",    label: "稳定性",     desc: "两种检索配置下结论与主要引用是否一致" },
    { key: "overall",      label: "综合得分",   desc: "准确性 35% + 完整性 20% + 可追溯 15% + 时效 15% + 稳定 15%" }
  ];

  const pct = (v) => (v * 100).toFixed(1) + "%";

  /* ============================================================
   * 动效层
   * 原则：动效只服务于信息层级（谁先出现、哪个数字更重），不做装饰性噪音。
   * 全部尊重 prefers-reduced-motion。
   * ============================================================ */
  const RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---- 顶部星轨画布：缓慢漂移的星点 + 偶发彗尾 ---- */
  function initStars() {
    const cv = $("heroStars");
    if (!cv || !cv.getContext) return;
    const ctx = cv.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let w = 0, h = 0, stars = [], comets = [], raf = null, running = false, t = 0;

    function build() {
      const r = cv.parentElement.getBoundingClientRect();
      w = Math.max(1, r.width); h = Math.max(1, r.height);
      cv.width = w * dpr; cv.height = h * dpr;
      cv.style.width = w + "px"; cv.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.min(220, Math.round(w * h / 8200));
      stars = [];
      for (let i = 0; i < n; i++) {
        stars.push({
          x: Math.random() * w, y: Math.random() * h, z: Math.random(),
          r: Math.random() * 1.15 + 0.3, tw: Math.random() * 6.283,
          vx: (Math.random() - 0.5) * 0.055, vy: (Math.random() - 0.5) * 0.038
        });
      }
    }

    function paintStars() {
      for (const s of stars) {
        const a = (0.22 + 0.78 * s.z) * (0.6 + 0.4 * Math.sin(t * 1.4 + s.tw));
        ctx.globalAlpha = a * 0.92;
        ctx.fillStyle = s.z > 0.86 ? "#E4EEFF" : (s.z > 0.5 ? "#A8CCF4" : "#7FA6D8");
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (0.55 + s.z), 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function spawnComet() {
      comets.push({
        x: Math.random() * w * 0.55 - 40, y: Math.random() * h * 0.55,
        v: 2.7 + Math.random() * 2.4, len: 80 + Math.random() * 110,
        life: 1, gold: Math.random() < 0.35
      });
    }

    function frame() {
      if (!running) return;
      t += 0.016;
      ctx.clearRect(0, 0, w, h);
      for (const s of stars) {
        s.x += s.vx; s.y += s.vy;
        if (s.x < -2) s.x = w + 2; if (s.x > w + 2) s.x = -2;
        if (s.y < -2) s.y = h + 2; if (s.y > h + 2) s.y = -2;
      }
      paintStars();
      for (let i = comets.length - 1; i >= 0; i--) {
        const c = comets[i];
        c.x += c.v; c.y += c.v * 0.30; c.life -= 0.008;
        if (c.life <= 0 || c.x > w + 160) { comets.splice(i, 1); continue; }
        const rgb = c.gold ? "240,201,106" : "127,196,242";
        const g = ctx.createLinearGradient(c.x - c.len, c.y - c.len * 0.30, c.x, c.y);
        g.addColorStop(0, "rgba(" + rgb + ",0)");
        g.addColorStop(1, "rgba(" + rgb + "," + (0.85 * c.life).toFixed(3) + ")");
        ctx.strokeStyle = g; ctx.lineWidth = 1.5; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(c.x - c.len, c.y - c.len * 0.30); ctx.lineTo(c.x, c.y); ctx.stroke();
      }
      raf = requestAnimationFrame(frame);
    }

    function start() { if (running || RM) return; running = true; raf = requestAnimationFrame(frame); }
    function stop() { running = false; if (raf) cancelAnimationFrame(raf); raf = null; }

    build();
    t = 1.2;
    if (RM) { paintStars(); }            // 静态星点，不做动画
    else {
      start();
      setInterval(() => { if (comets.length < 3 && !document.hidden) spawnComet(); }, 2400);
      setTimeout(spawnComet, 600);
      if ("IntersectionObserver" in window) {
        new IntersectionObserver((es) => {
          es[0].isIntersecting ? start() : stop();
        }, { threshold: 0 }).observe(cv);
      }
    }
    window.addEventListener("resize", () => { stop(); build(); RM ? paintStars() : start(); });
  }

  function initHeroParallax() {

    const stars = $("heroStars"), aurora = document.querySelector(".hero-aurora"), inner = document.querySelector(".hero-in");

      if (stars) stars.style.transform = "translate3d(0," + (y * 0.30).toFixed(1) + "px,0)";
      // 极光不能改 transform：CSS 的 aurora 关键帧在动 transform，动画优先级高于行内样式。
      // 改 top（关键帧没用到）才动得起来。

      if (inner) inner.style.opacity = Math.max(0, 1 - y / 560).toFixed(3);

      el.style.width = (max > 0 ? Math.min(100, window.scrollY / max * 100) : 0) + "%";

  /* ---- 滑动指示器 ----
   * 为什么用 offsetLeft / 计算宽度，而不是 getBoundingClientRect：
   * 切页时 .card 还在跑入场动画（transform: translateY(16px) scale(.994)），
   * rect 会被这个 scale 缩放，量出来的宽度会比真实布局宽度小 0.5px 左右，
   * 药丸就永远差那么一点点。offsetLeft 与计算宽度都是布局值，不受祖先 transform 影响。
   * 药丸是 left:0 的绝对定位元素，左右都相对 offsetParent 的 padding edge，
   * 与按钮的 offsetLeft 共用同一坐标系，直接平移过去即可 —— 不用再猜 containing-block。 */
  function placePill(pill, target, animate) {
    if (!pill || !target) return;
    const w = parseFloat(window.getComputedStyle(target).width);
    if (!isFinite(w) || w <= 0) return;     // 视图不可见时量不到尺寸，等可见后再同步
    // 首帧（首次布局 / resize 后）不能带过渡，否则药丸会从上一位置飘过来
    pill.style.transition = animate === false ? "none" : "";
    pill.style.width = w + "px";
    pill.style.transform = "translateX(" + target.offsetLeft + "px)";
    if (animate === false) requestAnimationFrame(() => { pill.style.transition = ""; });
  }

  function syncTabPill(animate) {
    const bar = $("tabbar"); if (!bar) return;
    const pill = bar.querySelector(".tab-pill"), on = bar.querySelector(".tab.on");
    if (!pill || !on) return;
    placePill(pill, on, animate);
  }
  function syncSegPill(animate) {
    const seg = $("askSeg"); if (!seg) return;
    const pill = seg.querySelector(".seg-pill"), on = seg.querySelector("button.on");
    if (!pill || !on) return;
    pill.classList.toggle("v1", (on.dataset.s || "") === "v1");
    placePill(pill, on, animate);
  }

  /* ---- 进度条：从 0 生长，错峰但设上限（24 行的表格不能等到 2 秒） ---- */
  function growBars(root) {
    (root || document).querySelectorAll("[data-w]").forEach((el, i) => {
      const w = el.dataset.w + "%";
      el.style.width = "0%";
      if (RM) { el.style.width = w; return; }
      setTimeout(() => { el.style.width = w; }, 80 + Math.min(i, 12) * 55);
    });
  }

  /* ---- 数字滚动 ---- */
  function countUp(root) {
    (root || document).querySelectorAll("[data-count]").forEach((el) => {
      const to = parseFloat(el.dataset.count);
      if (isNaN(to)) return;
      const dec = parseInt(el.dataset.dec || "0", 10);
      const suffix = el.dataset.suffix || "";
      if (RM) { el.textContent = to.toFixed(dec) + suffix; return; }
      const dur = 880, t0 = performance.now();
      const step = (now) => {
        const p = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - p, 3);
        el.textContent = (to * e).toFixed(dec) + suffix;
        if (p < 1) requestAnimationFrame(step);
      };
      el.textContent = (0).toFixed(dec) + suffix;
      requestAnimationFrame(step);
    });
  }

  function enhance(root) { growBars(root); countUp(root); }

        <div class="meta">${esc(e.cat)}　|　来源：${esc(e.source)}（${esc(e.srcType)}）　|　版本 ${esc(e.version)}　|　${esc(e.date)}</div>
        <div style="margin-top:7px">${statusBadge}</div>
      </div>`;
    }).join("") || `<div class="evi"><span class="score">未检索到任何匹配条目</span></div>`;

    const flagsHtml = (out.flags && out.flags.length)
      ? `<div class="note warn" style="margin:12px 0 0">${out.flags.map((f) => "⚠ " + esc(f.text)).join("<br>")}</div>`
      : "";

    $("askResult").innerHTML = `
    <div class="card">
      <div class="card-h">
        <div><div class="eyebrow">Answer</div><h3>${esc(q)}</h3></div>
        <div style="display:flex;gap:7px;flex-wrap:wrap">${stateBadge} ${flagBadges}
          <span class="badge b-mut">检索覆盖率 ${pct(cov)}</span></div>
      </div>
      <div class="answer">
        <div class="answer-h">
          <span>${esc(st.name)}　·　答案由知识库条目组合生成（离线可复现）</span>
          <span class="st">引用：${out.citations.length ? esc(out.citations.join("  ")) : "无引用输出"}</span>
        </div>
        <div class="answer-b ${out.refused ? "refuse" : ""}">${esc(out.display || out.text)}</div>
      </div>
      ${flagsHtml}
    </div>

    <div class="card tight">
      <div class="card-h"><h3>检索到的资料（可核查的作答依据）</h3>
        <span class="hint">topK=${st.topK}　·　命中 ${out.retrieved.totalHits} 条　·　覆盖率 ${pct(cov)}</span></div>
      ${evi}
    </div>`;

    enhance($("askResult"));    // 证据条按相关度依次生长
  }

  /* ================= 02 知识库 ================= */
  let kbCat = "全部", kbQ = "";
  function renderKB() {
    const cats = ["全部"].concat(Array.from(new Set(KB.entries.map((e) => e.cat))));
    $("view-kb").innerHTML = `
    <div class="card">
      <div class="card-h"><div><div class="eyebrow">Knowledge Base</div>
        <h3>知识库维护表（${KB.entries.length} 条）</h3></div>
        <span class="hint">状态字段是评测时效性的基础，不是装饰</span></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <select class="field" id="kbCat">${cats.map((c) => `<option>${esc(c)}</option>`).join("")}</select>
        <input class="field" id="kbSearch" style="max-width:280px" placeholder="搜索标题 / 关键词 / 正文">
        <button class="btn sm" id="kbReset">重置</button>
        <span class="hint" id="kbCount"></span>
      </div>
    </div>
    <div class="card tight">
      <div class="tbl-wrap"><table>
        <thead><tr><th style="width:74px">编号</th><th>标题</th><th style="width:96px">分类</th>
          <th style="width:70px">来源</th><th style="width:70px">版本</th><th style="width:98px">日期</th>
          <th style="width:78px">状态</th></tr></thead>
        <tbody id="kbBody"></tbody>
      </table></div>
    </div>
    <div id="kbDetail"></div>`;

    $("kbCat").addEventListener("change", () => { kbCat = $("kbCat").value; paintKB(); });
    $("kbSearch").addEventListener("input", () => { kbQ = $("kbSearch").value; paintKB(); });
    $("kbReset").addEventListener("click", () => { kbCat = "全部"; kbQ = ""; $("kbCat").value = "全部"; $("kbSearch").value = ""; paintKB(); });
    paintKB();
    $("kbBody").addEventListener("click", (e) => {
      const tr = e.target.closest("tr"); if (!tr) return;
      const e2 = KB.entries.find((x) => x.id === tr.dataset.id);
      if (e2) renderKBDetail(e2);
    });
  }

  function paintKB() {
    const q = kbQ.trim().toLowerCase();
    const rows = KB.entries.filter((e) => (kbCat === "全部" || e.cat === kbCat) &&
      (!q || (e.title + e.content + (e.keywords || []).join("")).toLowerCase().includes(q)));
    $("kbCount").textContent = "筛选出 " + rows.length + " 条";
    $("kbBody").innerHTML = rows.map((e) => `
      <tr data-id="${esc(e.id)}" style="cursor:pointer">
        <td class="mono" style="color:var(--accent)">${esc(e.id)}</td>
        <td style="font-weight:600;color:var(--ink)">${esc(e.title)}</td>
        <td><span class="badge b-mut">${esc(e.cat)}</span></td>
        <td>${esc(e.srcType)}</td><td class="mono">${esc(e.version)}</td>
        <td class="mono" style="font-size:11.6px">${esc(e.date)}</td>
        <td>${e.status === "有效" ? '<span class="badge b-ok">有效</span>'
            : e.status === "待复核" ? '<span class="badge b-warn">待复核</span>'
            : '<span class="badge b-bad">已过期</span>'}</td>
      </tr>`).join("");
    $("kbDetail").innerHTML = "";
  }

  function renderKBDetail(e) {
    $("kbDetail").innerHTML = `
    <div class="card">
      <div class="card-h"><div><div class="eyebrow">Entry ${esc(e.id)}</div>
        <h3>${esc(e.title)}</h3></div>
        <span class="badge ${e.status === "有效" ? "b-ok" : e.status === "待复核" ? "b-warn" : "b-bad"}">${esc(e.status)}</span></div>
      <div class="grid g2">
        <div>
          <p style="font-size:13.2px;color:var(--ink-2);margin:0 0 12px">${esc(e.content)}</p>

            <dt>分类</dt><dd>${esc(e.cat)}</dd>
            <dt>来源</dt><dd>${esc(e.source)}</dd>

            <dt>资料版本</dt><dd>${esc(e.version)}</dd>

  }

  /* ================= 03 测试集 ================= */

    const behText = (b) => b === "refuse" ? '<span class="badge b-warn">必须拒答</span>'
      : b === "flag" ? '<span class="badge b-gold">须带风险提示</span>'
      : '<span class="badge b-ok">正常作答</span>';
    $("view-tests").innerHTML = `
    <div class="card">
      <div class="card-h"><div><div class="eyebrow">Golden Test Set</div>
        <h3>标准测试集 ${esc(TS.meta.name)} ${esc(TS.meta.version)}（${TS.cases.length} 题）</h3></div>
        <span class="hint">每题写明「期望行为」，而不只是期望答案</span></div>
      <div class="note">${esc(TS.meta.principle)}</div>
    </div>
    <div class="card tight">
      <div class="tbl-wrap"><table>
        <thead><tr><th style="width:56px">题号</th><th style="width:104px">类型</th><th>问题</th>

        <tbody>${TS.cases.map((c) => `
          <tr data-q="${esc(c.id)}" style="cursor:pointer">

            <td style="font-weight:600;color:var(--ink)">${esc(c.question)}</td>
            <td>${behText(c.expect.behavior)}${c.expect.warn ? `<div style="margin-top:4px"><span class="badge ${c.expect.warn === "conflict" ? "b-gold" : "b-bad"}">${c.expect.warn === "conflict" ? "冲突" : "过期"}</span></div>` : ""}</td>
            <td class="mono" style="font-size:11.6px">${c.expect.refs.length ? esc(c.expect.refs.join(" ")) : "—"}</td>
          </tr>`).join("")}</tbody>
      </table></div>
    </div>
    <div id="testDetail"></div>`;

    document.querySelector("#view-tests table").addEventListener("click", (e) => {

      const c = TS.cases.find((x) => x.id === tr.dataset.q);
      if (c) renderTestDetail(c);

  function renderTestDetail(c) {
    $("testDetail").innerHTML = `
    <div class="card">
      <div class="card-h"><div><div class="eyebrow">Case ${esc(c.id)} · ${esc(c.type)}</div>
        <h3>${esc(c.question)}</h3></div>
        <span class="badge ${c.expect.behavior === "refuse" ? "b-warn" : c.expect.behavior === "flag" ? "b-gold" : "b-ok"}">
          期望：${c.expect.behavior === "refuse" ? "拒答" : c.expect.behavior === "flag" ? "带风险提示" : "作答"}</span></div>
      <div class="grid g2">
        <div>
          <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px">标准答案（人工标注）</div>
          <div class="note">${esc(c.gold)}</div>
          <div style="font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 7px">评分要点</div>
          <ul class="plain">${c.expect.points.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>
        </div>
        <div>
          <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px">应引用知识条目</div>
          <div>${c.expect.refs.length ? c.expect.refs.map((r) => {
            const e = KB.entries.find((x) => x.id === r);
            return `<div class="evi"><div class="top"><span class="t"><span class="mono" style="color:var(--accent)">[${esc(r)}]</span> ${esc(e ? e.title : "")}</span></div>
              <div class="meta">${e ? esc(e.source) + "（" + esc(e.srcType) + "）· 版本 " + esc(e.version) + " · " + esc(e.date) : ""}</div></div>`;
          }).join("") : '<span class="hint">无（该题考察的是「不乱引用」，拒答即为正确）</span>'}</div>
          <div class="note warn" style="margin-top:10px">
            <b>这题的考察意图</b><br>
            ${c.type === "常见问题" ? "验证基础知识的检索与作答是否准确。"
              : c.type === "易混淆问题" ? "验证 Agent 能否区分容易混为一谈的概念，而不是含糊作答。"
              : c.type === "资料缺失" ? "验证 Agent 在缺少依据时敢不敢说「不知道」——这是幻觉的第一道防线。"
              : c.type === "过期资料" ? "验证 Agent 能否识别资料的版本时效，而不是把旧结论当成现结论。"

      </div>

  /* ================= 04 效果评测 ================= */
  let evalCache = {};

  function renderEval() {
    $("view-eval").innerHTML = `
    <div class="card">
      <div class="card-h"><div><div class="eyebrow">Evaluation</div>
        <h3>标准测试集自动评测</h3></div>
        <div style="display:flex;gap:9px;flex-wrap:wrap">
          <button class="btn" id="runV1">运行 v1 评测</button>
          <button class="btn primary" id="runV2">运行 v2 评测</button>
          <button class="btn gold" id="runCmp">一键对比 v1 / v2</button>
        </div></div>
      <div class="note">
        评测在浏览器本地执行：把 ${TS.cases.length} 道题逐题送入检索与作答流程，再将输出与
        <b>人工标注的标准答案、期望行为、应引用条目</b>逐项比对。以下所有数字均由本次运行实时算出。
      </div>
    </div>
    <div id="evalOut"><div class="card tight"><div class="note warn">点击右上角按钮开始评测（v2 评测约需 1 秒）。</div></div></div>
    <div id="evalDetail"></div>`;

    $("runV1").addEventListener("click", () => { evalCache.v1 = engine.evaluate("v1"); paintEval("v1"); });
    $("runV2").addEventListener("click", () => { evalCache.v2 = engine.evaluate("v2"); paintEval("v2"); });
    $("runCmp").addEventListener("click", () => {
      $("evalOut").innerHTML = `<div class="card tight"><div class="hint"><span class="spin"></span>正在运行 ${TS.cases.length} 题 × 2 套策略 × 2 种检索配置…</div></div>`;
      setTimeout(() => {
        evalCache.v1 = engine.evaluate("v1");
        evalCache.v2 = engine.evaluate("v2");
        paintEval("cmp");
      }, 40);
    });
  }

  function metricCards(m, tone) {
    return METRIC_DEF.map((d) => {
      const v = m[d.key];
      const cls = d.key === "overall" ? "accent" : (v >= 0.85 ? "good" : v >= 0.6 ? "warn" : "bad");
      return `<div class="kpi ${cls}">
        <div class="lab">${esc(d.label)}</div>
        <div class="val" data-count="${(v * 100).toFixed(1)}" data-dec="1" data-suffix="%">${pct(v)}</div>
        <div class="desc">${esc(d.desc)}</div>
      </div>`;
    }).join("");
  }

  function paintEval(mode) {
    if (mode === "cmp" && evalCache.v1 && evalCache.v2) {
      const a = evalCache.v1.metrics, b = evalCache.v2.metrics;
      const deltaRow = (d) => {
        const dv = b[d.key] - a[d.key];
        const dir = dv > 0.0001 ? "up" : dv < -0.0001 ? "down" : "";
        return `<tr>
          <td style="font-weight:600">${esc(d.label)}</td>
          <td class="num">${pct(a[d.key])}</td>
          <td class="num">${pct(b[d.key])}</td>
          <td class="num"><span class="delta ${dir}">${dv >= 0 ? "+" : ""}${(dv * 100).toFixed(1)} pt</span></td>
          <td style="color:var(--muted);font-size:12.3px">${esc(d.desc)}</td>
        </tr>`;
      };
      const passA = evalCache.v1.results.filter((r) => r.passed).length;
      const passB = evalCache.v2.results.filter((r) => r.passed).length;

      const byTypeRows = Object.keys(evalCache.v2.byType).map((t) => {
        const x = evalCache.v1.byType[t] || { n: 0, pass: 0 };
        const y = evalCache.v2.byType[t];
        return `<tr><td>${esc(t)}</td>
          <td class="num">${x.pass}/${x.n}</td>
          <td class="num">${y.pass}/${y.n}</td>
          <td class="num"><span class="delta ${y.pass > x.pass ? "up" : ""}">${y.pass - x.pass >= 0 ? "+" : ""}${y.pass - x.pass}</span></td></tr>`;
      }).join("");

      $("evalOut").innerHTML = `
      <div class="card">
        <div class="card-h"><h3>v1 → v2 指标对比</h3>
          <span class="hint">完整验收：v1 ${evalCache.v1.passCount}/${TS.cases.length} → v2 ${evalCache.v2.passCount}/${TS.cases.length}　｜　
          内容通过（不含引用要求）：v1 ${evalCache.v1.passContentCount}/${TS.cases.length} → v2 ${evalCache.v2.passContentCount}/${TS.cases.length}</span></div>
        <div class="tbl-wrap"><table class="mtable">
          <thead><tr><th>指标</th><th style="width:96px">v1 初版</th><th style="width:96px">v2 优化</th>
            <th style="width:110px">变化</th><th>口径</th></tr></thead>
          <tbody>${METRIC_DEF.map(deltaRow).join("")}</tbody>
        </table></div>
        <div class="legend">
          <span><b>两级判定：</b>「内容通过」= 行为正确 且 要点覆盖≥50%；「完整验收」= 内容通过 且 依据可追溯。</span>
        </div>
      </div>

      <div class="grid g2">
        <div class="card tight">
          <div class="eyebrow">v1 · 初版策略</div>
          <div class="grid g2" style="margin-top:10px">${metricCards(evalCache.v1.metrics, "v1")}</div>
        </div>
        <div class="card tight">
          <div class="eyebrow">v2 · 优化策略</div>
          <div class="grid g2" style="margin-top:10px">${metricCards(evalCache.v2.metrics, "v2")}</div>
        </div>
      </div>

      <div class="grid g2">
        <div class="card tight">
          <div class="card-h"><h3>分类通过率变化</h3><span class="hint">完整验收口径</span></div>
          <div class="tbl-wrap"><table class="mtable">
            <thead><tr><th>题目类型</th><th style="width:80px">v1</th><th style="width:80px">v2</th><th style="width:64px">Δ</th></tr></thead>
            <tbody>${byTypeRows}</tbody></table></div>
        </div>
        <div class="card tight">
          <div class="card-h"><h3>v1 失败原因归因</h3><span class="hint">共 ${Object.values(evalCache.v1.causeAgg).reduce((s, x) => s + x, 0)} 处</span></div>
          ${Object.keys(evalCache.v1.causeAgg).length ? Object.keys(evalCache.v1.causeAgg).map((k) => `
            <div style="padding:8px 0;border-bottom:1px dashed var(--line-2);font-size:12.7px;color:var(--ink-2)">
              <b style="color:var(--bad)">${evalCache.v1.causeAgg[k]} 处</b>　${esc(k)}</div>`).join("")
          : '<div class="hint">无失败项</div>'}
        </div>
      </div>

      <div class="card tight">
        <div class="note">
          <b>结果解读（一）：v1 的「完整性」看着不差，但它 0 题通过完整验收</b><br>
          v1 会把最相似的一条资料原文直接抛出来——资料本身是对的，所以内容层面能过 16/24；
          但答案<b>没有任何来源标注、不会拒答、不会提示过期与冲突</b>，因此完整验收挂零。
          这正是真实项目里最容易犯的错：把「答得像」当成「答案可靠」。
        </div>
      </div>

      <div class="card tight">
        <div class="note warn">
          <b>结果解读（二）：v2 并不是全指标单调变好——稳定性反而从 ${pct(evalCache.v1.metrics.stability)} 掉到 ${pct(evalCache.v2.metrics.stability)}</b><br>
          原因很具体：v2 引入了拒答阈值，个别处在阈值边缘的问题（如「星魂和行迹有什么区别」）
          在换一种问法后可能从「作答」翻转为「拒答」。<b>提高准确性的代价是边界稳定性下降</b>，
          这是这一轮迭代暴露出的真实权衡，也是下一步要调阈值的依据——而不是一句「优化后全面提升」。
        </div>
      </div>`;

      $("evalDetail").innerHTML = renderCaseTable(evalCache.v2, evalCache.v1);
      enhance($("evalOut")); enhance($("evalDetail"));   // KPI 数字滚动 + 覆盖率条生长
      return;
    }

    const res = evalCache[mode];
    if (!res) { $("evalOut").innerHTML = `<div class="card tight"><div class="note warn">请先运行 ${mode} 评测。</div></div>`; return; }
    const pass = res.results.filter((r) => r.passed).length;
    const caus = Object.keys(res.causeAgg);
    $("evalOut").innerHTML = `
      <div class="card">
        <div class="card-h"><div><div class="eyebrow">${esc(engine.STRATEGIES[res.strategy].name)}</div>
          <h3>评测结果：通过 ${pass}/${TS.cases.length} 题</h3></div>
          <span class="hint">综合得分 ${pct(res.metrics.overall)}</span></div>
        <div class="grid g3">${metricCards(res.metrics)}</div>
      </div>
      ${caus.length ? `<div class="card tight"><div class="card-h"><h3>失败原因归因</h3></div>
        ${caus.map((k) => `<div style="padding:8px 0;border-bottom:1px dashed var(--line-2);font-size:12.7px;color:var(--ink-2)">
          <b style="color:var(--bad)">${res.causeAgg[k]} 处</b>　${esc(k)}</div>`).join("")}</div>` : ""}`;
    $("evalDetail").innerHTML = renderCaseTable(res, null);
    enhance($("evalOut")); enhance($("evalDetail"));
  }

  /* 要点覆盖率：数字 + 条形，条形按档位换色 */
  function covCell(v) {
    const n = Math.round(v * 100);
    const tone = n >= 85 ? "g" : n >= 60 ? "w" : "b";
    return `<div class="cov"><span class="n">${n}%</span>
      <div class="mbar ${tone}"><i data-w="${n}"></i></div></div>`;
  }

  function renderCaseTable(res, base) {
    const rows = res.results.map((r) => {
      const c = r.case;
      const mark = (ok) => ok ? '<span style="color:var(--ok);font-weight:700">✓</span>'
        : '<span style="color:var(--bad);font-weight:700">✗</span>';
      const warnBadge = r.flags.length
        ? r.flags.map((f) => `<span class="badge ${f.type === "conflict" ? "b-gold" : "b-warn"}">${f.type === "conflict" ? "冲突" : "过期"}</span>`).join(" ")
        : '<span class="hint">—</span>';
      const baseR = base ? base.results.find((x) => x.case.id === c.id) : null;
      const prog = baseR ? (baser(r, baseR)) : "";
      return `<tr>
        <td class="mono" style="color:var(--accent)">${esc(c.id)}</td>
        <td><span class="badge b-mut">${esc(c.type)}</span></td>
        <td style="font-weight:600;color:var(--ink);max-width:320px">${esc(c.question)}</td>
        <td class="num">${r.out.refused ? "拒答" : "作答"}</td>
        <td>${warnBadge}</td>
        <td class="num">${mark(r.behaviorOK)}</td>
        <td>${covCell(r.pointsCovered)}</td>
        <td class="num">${mark(r.traceOK)}</td>
        <td class="num">${mark(r.freshOK)}</td>
        <td>${r.passed ? '<span class="badge b-ok">完整通过</span>'
              : r.passedContent ? '<span class="badge b-warn">内容通过·不可追溯</span>'
              : '<span class="badge b-bad">未通过</span>'}</td>
        <td style="font-size:12.2px;color:var(--muted);max-width:280px">${prog}${esc(r.cause || "")}</td>
      </tr>`;
    }).join("");

    return `<div class="card">
      <div class="card-h"><h3>${base ? "逐题结果（v2，附与 v1 的差异）" : "逐题结果"}</h3>
        <span class="hint">点击下方表格行可在「错误分析与迭代」查看原始回答</span></div>
      <div class="tbl-wrap"><table class="mtable">
        <thead><tr><th style="width:54px">题号</th><th style="width:96px">类型</th><th>问题</th>
          <th style="width:56px">行为</th><th style="width:110px">风险提示</th>
          <th style="width:48px">准确性</th><th style="width:86px">完整性</th>
          <th style="width:56px">可追溯</th><th style="width:56px">时效性</th>
          <th style="width:70px">判定</th><th>归因</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="legend">
        <span><i class="dot" style="background:var(--ok)"></i>✓ 通过该项检查</span>
        <span><i class="dot" style="background:var(--bad)"></i>✗ 未通过该项检查</span>
        <span>准确性=行为是否符合预期；完整性=要点覆盖；可追溯=是否标注来源；时效性=是否引用过期资料</span>
      </div>
    </div>`;
  }

  function baser(cur, base) {
    if (base.passed === cur.passed) return "";
    return base.passed
      ? '<span class="badge b-bad" style="margin-right:6px">v1 反而通过</span>'
      : '<span class="badge b-ok" style="margin-right:6px">v1 未通过 → 已修复</span>';
  }

  /* ================= 05 错误分析与迭代 ================= */
  const FOCUS = [
    { id: "Q16", title: "未来版本问题：把「无依据」答成了「有依据」", tag: "拒答缺失" },
    { id: "Q17", title: "跨游戏问题：用相近概念强行迁移作答", tag: "范围越界" },
    { id: "Q04", title: "保底抽数：面对冲突资料没有做来源取舍", tag: "资料冲突" },
    { id: "Q20", title: "过期配队：把 3.0 的结论当成当前结论", tag: "资料过期" },
    { id: "Q10", title: "易混概念：没有把两个体系分清就作答", tag: "答案结构" }
  ];

  function renderIter() {
    const v1 = engine.evaluate("v1"), v2 = engine.evaluate("v2");
    evalCache.v1 = v1; evalCache.v2 = v2;

    const cases = FOCUS.map((f) => {
      const c = TS.cases.find((x) => x.id === f.id);
      const r1 = v1.results.find((x) => x.case.id === f.id);
      const r2 = v2.results.find((x) => x.case.id === f.id);
      return { f, c, r1, r2 };
    });

    const iterLog = [
      { v: "v0.1", date: "10-08", title: "搭起最小可用问答", desc: "手写 12 条机制条目，关键词匹配检索，直接输出最相似条目正文。", issue: "答得出来，但无法判断答得对不对" },
      { v: "v0.2", date: "10-10", title: "建立知识库结构", desc: "条目补齐到 30 条，增加来源、版本、日期字段；检索改为 BM25，加子查询覆盖率。", issue: "发现同一问题常召回来源冲突的多条资料，无法取舍" },
      { v: "v0.3", date: "10-12", title: "构建标准测试集", desc: "按「常见／易混淆／缺失／过期／推理」五类设计 24 题，逐题写定期望行为与评分要点。", issue: "测试集一跑，v1 策略在「拒答」与「提示」两类上几乎全灭" },
      { v: "v1", date: "10-13", title: "定版 v1 策略（对照基线）", desc: "不引用、不拒答、无时效过滤，作为对照基线保留。", issue: "60% 左右的题能答对内容，但答案不可核查" },
      { v: "v2", date: "10-15", title: "优化策略与知识库同步升级", desc: "补边界／冲突样本条目；提示词强制引用、设拒答阈值、多来源冲突取舍、过期资料提示。", issue: "目标：把「答得像」变成「答案可靠」" }
    ];

    $("view-iter").innerHTML = `
    <div class="card">
      <div class="card-h"><div><div class="eyebrow">Error Analysis &amp; Iteration</div>
        <h3>错误案例与迭代复测</h3></div>
        <span class="hint">下面每一组对比都是本次实时运行的输出，不是示意稿</span></div>
      <div class="note gold">
        <b>这一页是整个项目最想说明的事</b>：AI 应用的差距往往不在「能不能答」，而在
        <b>答错的时候系统自己知不知道</b>。下面 5 组案例覆盖了资料缺失、范围越界、来源冲突、
        资料过期与概念混淆——它们不是被藏起来的失败，而是被记录、归因、然后修掉的证据。
      </div>
    </div>

    ${cases.map(({ f, c, r1, r2 }) => `
    <div class="card">
      <div class="card-h">
        <div><div class="eyebrow">${esc(f.id)} · ${esc(f.tag)}</div><h3>${esc(f.title)}</h3></div>
        <div style="display:flex;gap:7px">
          <span class="badge ${r1.passed ? "b-ok" : "b-bad"}">v1 ${r1.passed ? "通过" : "未通过"}</span>
          <span class="badge ${r2.passed ? "b-ok" : "b-bad"}">v2 ${r2.passed ? "通过" : "未通过"}</span>
        </div>
      </div>
      <div style="font-size:13.4px;font-weight:600;margin-bottom:11px">问：${esc(c.question)}</div>
      <div class="cmp">
        <div class="cmp-col v1"><div class="hd"><span>v1 初版策略</span><span>${r1.out.refused ? "拒答" : "作答"}</span></div>
          <div class="bd">${esc(r1.out.display || r1.out.text)}</div></div>
        <div class="cmp-col v2"><div class="hd"><span>v2 优化策略</span><span>${r2.out.refused ? "拒答" : "作答"}</span></div>
          <div class="bd">${esc(r2.out.display || r2.out.text)}</div></div>
      </div>
      <div class="grid g2" style="margin-top:12px">
        <div class="note warn"><b>v1 问题归因</b><br>${esc(r1.cause || "（该题 v1 亦通过）")}</div>
        <div class="note"><b>修复动作</b><br>${esc(fixOf(r1, r2))}</div>
      </div>
    </div>`).join("")}

    <div class="card">
      <div class="eyebrow">Iteration Log</div>
      <div class="card-h"><h3>迭代记录</h3><span class="hint">从「能答」到「可靠」的五个版本</span></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th style="width:64px">版本</th><th style="width:64px">日期</th><th style="width:210px">做了什么</th>
          <th>具体内容</th><th style="width:250px">暴露出的问题</th></tr></thead>
        <tbody>${iterLog.map((l) => `
          <tr><td class="mono" style="color:var(--accent);font-weight:700">${esc(l.v)}</td>
            <td class="mono">${esc(l.date)}</td>
            <td style="font-weight:600;color:var(--ink)">${esc(l.title)}</td>
            <td style="font-size:12.6px;color:var(--ink-2)">${esc(l.desc)}</td>
            <td style="font-size:12.5px;color:var(--muted)">${esc(l.issue)}</td></tr>`).join("")}
        </tbody></table></div>
    </div>

    <div class="grid g2">
      <div class="card tight">
        <div class="eyebrow">Method</div>
        <h3 style="font-size:14.5px;margin-bottom:9px">可复用的评测方法</h3>
        <ul class="plain">
          <li><b>测试集先于优化</b>：先定义「什么叫答对」，再谈调优，否则优化没有方向</li>
          <li><b>期望行为 ≠ 期望答案</b>：拒答、提示过期、提示冲突，本身就是正确输出</li>
          <li><b>指标要能归因</b>：把失败映射到知识库 / 提示词 / 检索三类原因，才改得动</li>
          <li><b>稳定性单独测</b>：同一问题换说法或换检索参数，结论应当一致</li>
          <li><b>保留基线</b>：v1 不删，才说得清每一分提升来自哪里</li>
        </ul>
      </div>
      <div class="card tight">
        <div class="eyebrow">Limitations</div>
        <h3 style="font-size:14.5px;margin-bottom:9px">已知局限与下一步</h3>
        <ul class="plain">
          <li><b>当前为离线确定性引擎</b>：检索与作答逻辑真实运行，但未接入真实 LLM；接入后需增加「同一问题多次采样」的稳定性评测</li>
          <li><b>知识库为个人快照</b>：覆盖机制与少量角色，未覆盖全角色、全版本活动与剧情</li>
          <li><b>评分依赖关键词与要点覆盖</b>：语义等价但措辞差异大的回答可能被低估，后续可引入 LLM-as-judge 做二次校验</li>
          <li><b>下一步</b>：接入真实 RAG + 向量检索，补充「知识库更新后的回归测试」与「人工复核队列」</li>
        </ul>
      </div>
    </div>`;

    const tbl = document.querySelector("#view-iter table");
    if (tbl) tbl.addEventListener("click", () => {});
  }

  function fixOf(r1, r2) {
    if (r1.passed) return "该题 v1 已通过，v2 保持同等表现，未引入回退。";
    if (r1.out.refused !== r2.out.refused && r2.out.refused) {
      return "在知识库中补充「范围边界」类条目，并在提示词中加入拒答阈值规则：当检索覆盖率不足或问题超出覆盖范围时，明确说明「知识库未收录」并给出获取准确信息的建议渠道。";
    }
    if (r2.flags && r2.flags.some((f) => f.type === "conflict")) {
      return "保留冲突样本条目，并在提示词中要求「来源类型＝官方且版本最新者优先」，同时把冲突以风险提示的形式显式输出，而不是静默取一条。";
    }
    if (r2.flags && r2.flags.some((f) => f.type === "stale")) {
      return "为条目补上版本号与状态标记（有效／待复核／已过期），提示词中增加时效规则：命中已过期资料时必须提示其版本并说明不可直接套用。";
    }
    if (r2.out.citations.length && !r1.out.citations.length) {
      return "提示词由「直接回答」改为结构化输出：结论 → 依据（每条标注 [KB-xx] 与来源/版本）→ 风险提示 → 来源汇总，使答案可回溯。";
    }
    return "调整检索参数与答案结构，提高要点覆盖与引用完整度。";
  }

  /* ================= 启动 ================= */
  initScrollProgress(); initStars(); initHeroParallax();
  renderHero(); renderTabs(); renderOverview(); renderAsk(); renderKB(); renderTests(); renderEval();
  renderIter();           // 内部已完成 v1 / v2 各一次评测
  paintEval("cmp");       // 首屏直接展示对比结果
  enhance($("view-overview"));

  // 字体与布局稳定后再量一次指示器位置（字体换行会影响 tab / 分段控件宽度）
  const resync = () => { syncTabPill(false); syncSegPill(false); };
  requestAnimationFrame(resync);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resync).catch(() => {});
  window.addEventListener("load", resync);

  const hash = (location.hash || "").replace("#", "");
  if (hash && TABS.some((t) => t.id === hash)) {
    activateTab(hash);
    if (hash === "ask") doAsk("击破伤害主要受什么属性影响？");
  }
})();

</script>
</body>
</html>
